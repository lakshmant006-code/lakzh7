<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lo-Fi Wireframes – Reef</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="/work/quizai/embed-scroll-bridge.js"></script>
<style>
  html, body, #root {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #f4f4f2;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="./Wireframes.jsx"></script>
<script type="text/babel">
  function mountWireframes() {
    if (!window.QuizAiWireframes) {
      requestAnimationFrame(mountWireframes);
      return;
    }
    ReactDOM.createRoot(document.getElementById("root")).render(
      React.createElement(window.QuizAiWireframes)
    );
  }
  mountWireframes();
</script>
</body>
</html>
