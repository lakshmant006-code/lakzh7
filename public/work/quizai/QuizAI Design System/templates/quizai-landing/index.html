<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>QuizAI — Landing + App</title>
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script>
  // At iframe scroll edges, hand the wheel back to the parent page (Lenis).
  (function () {
    function onWheel(e) {
      if (!window.parent || window.parent === window) return;
      const maxScroll = Math.max(
        0,
        document.documentElement.scrollHeight - window.innerHeight
      );
      const y = window.scrollY || document.documentElement.scrollTop || 0;
      const atTop = y <= 0;
      const atBottom = y >= maxScroll - 1;
      if ((atTop && e.deltaY < 0) || (atBottom && e.deltaY > 0)) {
        e.preventDefault();
        window.parent.postMessage(
          {
            source: "quizai-embed",
            type: "wheel",
            deltaY: e.deltaY,
            deltaMode: e.deltaMode,
          },
          "*"
        );
      }
    }
    window.addEventListener("wheel", onWheel, { passive: false });
  })();
</script>
<style>
  html, body {
    margin: 0;
    background: #fff;
  }
  #root {
    min-height: 100%;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="./Landing.jsx"></script>
<script type="text/babel">
  function mountLanding() {
    if (!window.QuizAiLanding || !window.QuizAIDesignSystem_ab923d) {
      requestAnimationFrame(mountLanding);
      return;
    }
    ReactDOM.createRoot(document.getElementById("root")).render(
      React.createElement(window.QuizAiLanding)
    );
  }
  mountLanding();
</script>
</body>
</html>
