<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Lo-Fi Wireframes – Summer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #d9d9d9;
    font-family: sans-serif;
    padding: 24px;
  }

  /* ── Tabs ── */
  .tabs {
    display: flex; gap: 8px;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .tab-group {
    font-size: 10px; color: #777; text-transform: uppercase;
    letter-spacing: .06em; margin: 0 0 0 6px;
  }
  .tab-btn {
    padding: 6px 12px;
    border-radius: 20px;
    border: 1.5px solid #bbb;
    background: #f0f0f0;
    cursor: pointer;
    font-size: 12px;
    color: #555;
  }
  .tab-btn.active { background: #333; color: #fff; border-color: #333; }

  /* ── Browser shell ── */
  .browser {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    background: #f7f7f7;
    border-radius: 10px;
    border: 1.5px solid #bbb;
    overflow: hidden;
  }
  .top-bar {
    background: #555; height: 30px;
    display: flex; align-items: center; gap: 6px; padding: 0 12px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #888; }
  .url { flex: 1; max-width: 260px; height: 12px; margin: 0 auto; background: #888; border-radius: 3px; }
  .viewport { height: 540px; overflow: hidden; position: relative; }

  /* ── Pages ── */
  .page { display: none; height: 100%; }
  .page.active { display: block; }

  /* ── Primitives ── */
  .bar { height: 9px; background: #cfcfcf; border-radius: 3px; }
  .bar.dark { background: #555; }
  .bar.lite { background: #e0e0e0; }
  .bar.h12 { height: 12px; } .bar.h16 { height: 16px; } .bar.h24 { height: 24px; }
  .w20{width:20%}.w25{width:25%}.w30{width:30%}.w35{width:35%}.w40{width:40%}.w50{width:50%}.w60{width:60%}.w70{width:70%}.w80{width:80%}.w100{width:100%}
  .pill { height: 26px; border-radius: 6px; background: #555; }
  .pill.outline { background: #fafafa; border: 1.5px solid #c8c8c8; }
  .pill.round { border-radius: 14px; }
  .chip { height: 16px; width: 54px; border-radius: 8px; background: #e2e2e2; }
  .chip.dark { background: #9a9a9a; }
  .card {
    background: #fff; border: 1.5px solid #dcdcdc; border-radius: 8px; padding: 14px;
  }
  .row { display: flex; align-items: center; gap: 10px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .spread { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .grid { display: grid; gap: 12px; }
  .g2 { grid-template-columns: repeat(2, 1fr); }
  .g3 { grid-template-columns: repeat(3, 1fr); }
  .g4 { grid-template-columns: repeat(4, 1fr); }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .input { height: 28px; border: 1.5px solid #d0d0d0; border-radius: 5px; background: #fafafa; }
  .textarea { height: 52px; border: 1.5px solid #d0d0d0; border-radius: 5px; background: #fafafa; }
  .select { height: 28px; border: 1.5px solid #d0d0d0; border-radius: 5px; background: #fafafa; display:flex; align-items:center; justify-content:flex-end; padding-right:9px; }
  .chev { width: 7px; height: 7px; background: #c4c4c4; border-radius: 1px; }
  .toggle { width: 30px; height: 16px; border-radius: 8px; background: #d4d4d4; position: relative; flex-shrink: 0; }
  .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; }
  .toggle.on { background: #555; }
  .toggle.on::after { left: 16px; }
  .seg { display: inline-flex; align-self: flex-start; gap: 4px; padding: 3px; border-radius: 7px; background: #e6e6e6; }
  .seg span { width: 58px; height: 20px; border-radius: 5px; background: transparent; }
  .seg span.on { background: #555; }
  .tabline { display: flex; gap: 16px; border-bottom: 1.5px solid #e2e2e2; padding-bottom: 8px; }
  .tabline span { width: 36px; height: 8px; border-radius: 2px; background: #d0d0d0; }
  .tabline span.on { background: #555; }
  .avatar { width: 22px; height: 22px; border-radius: 50%; background: #d6d6d6; flex-shrink: 0; }
  .mono { height: 26px; width: 150px; border-radius: 4px; background: #bdbdbd; }

  /* ── App shell: sidebar + main ── */
  .app { display: grid; grid-template-columns: 168px 1fr; height: 100%; }
  .side {
    background: #fff; border-right: 1.5px solid #e0e0e0; padding: 12px 10px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .logo { width: 22px; height: 22px; border-radius: 5px; background: #555; margin-bottom: 4px; }
  .side .search { height: 22px; border-radius: 5px; background: #efefef; margin-bottom: 6px; }
  .side .label { height: 6px; width: 60px; background: #d8d8d8; border-radius: 2px; margin: 8px 4px 2px; }
  .nav { display: flex; align-items: center; gap: 7px; height: 22px; padding: 0 6px; border-radius: 5px; }
  .nav i { width: 10px; height: 10px; border-radius: 2px; background: #c8c8c8; }
  .nav b { height: 7px; background: #d2d2d2; border-radius: 2px; }
  .nav.on { background: #555; } .nav.on i, .nav.on b { background: #bbb; }
  .side .spacer { flex: 1; }
  .side .help { border: 1.5px solid #e2e2e2; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 5px; }
  .main { display: flex; flex-direction: column; min-width: 0; }
  .topstrip {
    height: 40px; border-bottom: 1.5px solid #e6e6e6; background: #fff;
    display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
  }
  .topstrip .q { width: 150px; height: 20px; border-radius: 10px; background: #efefef; }
  .body { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .table .tr { display: grid; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1.5px solid #eee; }
  .table .tr:last-child { border-bottom: 0; }
  .table .th { padding-bottom: 6px; }
  .entry { background: #f3f3f3; border-radius: 7px; padding: 11px 12px; }

  /* ── Landing ── */
  .landing { height: 100%; background: linear-gradient(160deg, #cfcfcf, #a9a9a9 55%, #e9e9e9); position: relative; }
  .lnav { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px; }
  .lnav .links { display: flex; gap: 16px; }
  .lnav .links span { width: 46px; height: 8px; background: #8f8f8f; border-radius: 2px; }
  .hero { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 46px; }
  .float { position: absolute; background: #fff; border-radius: 7px; border: 1.5px solid #d6d6d6; padding: 9px; display: flex; flex-direction: column; gap: 5px; }
  .stats { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 72%; background: #fff; border: 1.5px solid #d6d6d6; border-bottom: 0; border-radius: 9px 9px 0 0; padding: 12px 14px; }

  /* ── Sign in ── */
  .signin { height: 100%; background: linear-gradient(170deg, #bdbdbd, #7d7d7d 60%, #4d4d4d); display: flex; flex-direction: column; align-items: center; padding-top: 30px; gap: 10px; }
  .dome { width: 110px; height: 55px; border-radius: 110px 110px 0 0; background: #f2f2f2; }
  .glass { width: 300px; background: rgba(255,255,255,.18); border: 1.5px solid rgba(255,255,255,.45); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 11px; margin-top: 6px; }
  .glass .input { background: rgba(255,255,255,.25); border-color: rgba(255,255,255,.35); }
  .glass .bar { background: rgba(255,255,255,.6); }
</style>
</head>
<body>

<div class="tabs" role="tablist" aria-label="Wireframe screens">
  <button class="tab-btn active" onclick="showTab('landing', this)">Landing</button>
  <button class="tab-btn" onclick="showTab('signin', this)">Sign in</button>
  <span class="tab-group">Employee</span>
  <button class="tab-btn" onclick="showTab('emp-home', this)">Home</button>
  <button class="tab-btn" onclick="showTab('timesheet', this)">Timesheet</button>
  <button class="tab-btn" onclick="showTab('skills', this)">Skills</button>
  <span class="tab-group">Admin</span>
  <button class="tab-btn" onclick="showTab('admin-home', this)">Dashboard</button>
  <button class="tab-btn" onclick="showTab('clients', this)">Clients</button>
  <button class="tab-btn" onclick="showTab('client', this)">Client profile</button>
  <button class="tab-btn" onclick="showTab('roles', this)">Roles</button>

</div>

<div class="browser">

        <div class="float" style="right:26px;top:62px;width:128px"><div class="bar w70 lite"></div><div class="input"></div><div class="input" style="border-color:#777"></div><div class="input"></div></div>
        <div class="float" style="left:26px;top:300px;width:118px"><div class="bar w60 lite"></div><div class="bar h12 w80"></div><div class="row"><span class="chip"></span><span class="chip"></span></div></div>
        <div class="float" style="right:30px;top:320px;width:120px;flex-direction:row;align-items:center"><span class="avatar" style="width:30px;height:30px;border:3px solid #777;background:#fff"></span><div class="col" style="flex:1"><div class="bar w80"></div><div class="bar lite w60"></div></div></div>

              <div class="card col" style="gap:10px"><div class="spread"><div class="bar w40"></div><span class="pill outline" style="width:50px;height:20px"></span></div>
                <div class="spread"><div class="col" style="flex:1"><div class="bar w70"></div><div class="bar lite w50"></div></div><div class="col" style="width:70px;align-items:flex-end"><div class="bar w70"></div><div class="bar lite w100"></div></div></div>

    </div>

    <!-- Admin: Add role -->
    <div class="page" id="page-add-role">
      <div class="app">
        <aside class="side" data-side="admin" data-on="10"></aside>
        <div class="main">
          <div class="topstrip"><span class="q"></span><div class="row"><span class="bar" style="width:48px"></span><span class="pill" style="width:56px;height:22px"></span></div></div>
          <div class="body">
            <div class="head"><div class="col" style="flex:1"><div class="bar dark h16 w20"></div><div class="bar w40"></div></div><span class="chip"></span></div>
            <div class="card col" style="gap:10px">
              <div class="bar w20"></div>
              <div class="field" style="width:50%"><div class="bar w30"></div><div class="input"></div></div>
              <div class="field"><div class="bar w20"></div><div class="textarea"></div></div>
              <div class="bar dark w20" style="margin-top:4px"></div>
              <div class="col" style="gap:5px" data-modules="Organization,on;Manage Clients,on;Manage Roles,;Manage Teams,;Manage Projects,on"></div>
              <div class="row" style="justify-content:flex-end;border-top:1.5px solid #eee;padding-top:10px"><span class="pill outline" style="width:66px"></span><span class="pill" style="width:86px"></span></div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  // Fill in the repeated pieces: sidebars, table rows, key-value rows,
  // and module toggles.
  const SIDES = {
    employee: [["Home"], ["Timesheet"], ["Skills"], ["Profile"]],
    admin: [
      ["Home"], ["label"], ["Organization"], ["Clients"], ["Projects"], ["Activities"],
      ["Skills"], ["Time Tracking"], ["Reports"], ["label"], ["Employees"], ["Teams"], ["Roles"],
    ],
  };
  const ADMIN_ON = { 0: 0, 2: 3, 10: 12 };
  document.querySelectorAll(".side").forEach((side) => {
    const kind = side.dataset.side;
    const on = Number(side.dataset.on);
    const onIndex = kind === "admin" ? ADMIN_ON[on] : on;
    let html = '<div class="logo"></div><div class="search"></div>';
    if (kind === "employee") html += '<div class="label"></div>';
    SIDES[kind].forEach((item, i) => {
      if (item[0] === "label") { html += '<div class="label"></div>'; return; }
      const w = 30 + ((item[0].length * 7) % 45);
      html += `<div class="nav${i === onIndex ? " on" : ""}"><i></i><b style="width:${w}%"></b></div>`;
    });
    html += '<div class="spacer"></div><div class="help"><div class="bar w60"></div><div class="bar lite w80"></div><span class="pill" style="height:18px"></span></div>';
    side.innerHTML = html;
  });

  document.querySelectorAll(".table").forEach((t) => {
    const cols = t.dataset.cols;
    const n = Number(t.dataset.rows);
    const roles = !!t.dataset.roles;
    const widths = cols.split(" ");
    let html = `<div class="tr th" style="grid-template-columns:${cols}">` +
      widths.map(() => '<div class="bar lite w60"></div>').join("") + "</div>";
    for (let r = 0; r < n; r++) {
      html += `<div class="tr" style="grid-template-columns:${cols}">`;
      widths.forEach((_, c) => {
        if (!roles && c === widths.length - 2) html += `<span class="toggle${r < 2 ? " on" : ""}"></span>`;
        else if (!roles && c === widths.length - 1) html += '<div class="row"><span class="pill outline" style="width:38px;height:20px"></span><span class="pill" style="width:42px;height:20px"></span></div>';
        else if (roles && (c === 2 || c === 3)) html += '<span class="chip" style="width:24px"></span>';
        else if (roles && c === widths.length - 1) html += '<span class="pill" style="width:40px;height:20px"></span>';
        else html += `<div class="bar w${[60, 80, 70, 50][(r + c) % 4]}"></div>`;
      });
      html += "</div>";
    }
    t.innerHTML = html;
  });

  document.querySelectorAll("[data-kv]").forEach((el) => {
    let html = "";
    for (let i = 0; i < Number(el.dataset.kv); i++) {
      html += `<div class="spread" style="padding:9px 0;border-bottom:1.5px solid #eee"><div class="bar w20"></div><div class="bar" style="width:${[40, 30, 50, 35, 45, 60][i]}%;margin-right:auto;margin-left:60px"></div></div>`;
    }
    el.innerHTML = html;
  });

  document.querySelectorAll("[data-modules]").forEach((el) => {
    el.innerHTML = el.dataset.modules.split(";").map((m) => {
      const on = m.split(",")[1] === "on";
      return `<div class="entry spread" style="padding:7px 12px"><div class="bar w25"></div><span class="toggle${on ? " on" : ""}"></span></div>`;
    }).join("");
  });

  function showTab(name, btn) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    btn.classList.add('active');
  }

  // Forward wheel scrolling to the parent page so its Lenis smooth-scroll
  // handles it consistently instead of the browser's native scroll-chaining.
  (function () {
    const parentWin = window.parent;
    if (!parentWin || parentWin === window) return;
    window.addEventListener(
      "wheel",
      (e) => {
        e.preventDefault();
        parentWin.dispatchEvent(
          new parentWin.WheelEvent("wheel", {
            deltaX: e.deltaX,
            deltaY: e.deltaY,
            deltaMode: e.deltaMode,
            bubbles: true,
            cancelable: true,
          }),
        );
      },
      { passive: false },
    );
  })();
</script>
</body>
</html>
