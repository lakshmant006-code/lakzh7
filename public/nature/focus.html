<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Focus</title>
<style>
  :root { --paper: #f5f3ef; --ink: #2c2420; --soft: #8a7f76; }
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none;
    font: 400 14px/1.4 "DM Sans", -apple-system, system-ui, sans-serif; color: var(--ink); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* the trial-lens holder, over the photograph; it gives a little each time it is clicked */
  .holder { position: absolute; pointer-events: none; transform-origin: 47.8% 47.7%; filter: drop-shadow(0 18px 22px rgba(44, 36, 32, .28)) drop-shadow(0 3px 5px rgba(44, 36, 32, .25)); }
  .stage { position: absolute; inset: 0; cursor: pointer; }
  .note, .hint { position: absolute; left: 50%; text-align: center; pointer-events: none; white-space: nowrap; transition: opacity .9s ease, transform .9s cubic-bezier(.2, .8, .2, 1); }
  .note { opacity: 0; transform: translate(-50%, 8px); }
  .note.on { opacity: 1; transform: translate(-50%, 0); }
  .note .date { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); }
  .note .text { margin-top: 4px; font-size: 15px; }
  .hint { transform: translateX(-50%); font-size: 12px; color: var(--soft); opacity: 0; }
  .hint.on { opacity: 1; }
  .dots { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 7px; pointer-events: none; transition: opacity .6s; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(44, 36, 32, .18); transition: background .3s, transform .3s; }
  .dots i.on { background: var(--ink); transform: scale(1.15); }
</style>
</head>
<body>
<div class="stage" id="stage" role="button" aria-label="Click to turn the focus of the lens">
  <canvas id="c"></canvas>
  <img class="holder" id="holder" src="./focus/frame.webp" alt="A black trial-lens holder with a degree scale from 0 to 180, knurled knobs and a silver lever" draggable="false">
</div>
<div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
<div class="hint" id="hint">click the lens to bring it into focus</div>
<div class="note" id="note"><div class="date" id="date"></div><div class="text" id="text"></div></div>
<script>
/* The memory, written into the note once it is in focus. */
const MEMORY = { date: "", text: "The long road, and the balloon rising at the end of it." };
const STEPS = [1, 0.68, 0.42, 0.18, 0];                 // how far out of focus after each click: the fourth is clean

/* ---------- the photograph behind liquid glass ---------- */
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl", { premultipliedAlpha: false, antialias: true });
const VS = "attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }";
const FS = `precision highp float;
uniform sampler2D sharp, blurLo, blurHi;
uniform vec2 res, centre;
uniform float R, defocus, glass, ripple, rippleT, wob, dpr, t;
vec3 photo(vec2 uv, float d){
  vec3 a = texture2D(sharp, uv).rgb, b = texture2D(blurLo, uv).rgb, c = texture2D(blurHi, uv).rgb;
  d = clamp(d, 0.0, 1.0);
  return d < 0.5 ? mix(a, b, d * 2.0) : mix(b, c, d * 2.0 - 1.0);
}
void main(){
  vec2 f = vec2(gl_FragCoord.x, res.y - gl_FragCoord.y), q = f - centre;
  float r = length(q), n = r / R;
  if (n > 1.0) { gl_FragColor = vec4(0.0); return; }
  vec2 dir = r > 0.0 ? q / r : vec2(0.0);
  // liquid glass: a thick drop that magnifies in the middle and bends hard toward the rim,
  // with a ripple that runs out from the centre each time the focus is turned
  float bulge = mix(1.0, 0.86 + 0.2 * n * n, glass);
  float wave = sin(n * 26.0 - rippleT * 15.0) * exp(-rippleT * 2.6) * smoothstep(rippleT * 0.75 + 0.05, rippleT * 0.75 - 0.25, n) * ripple;
  vec2 w = q * bulge + dir * wave * R * 0.018 + vec2(sin(f.y * 0.02 + t * 1.3), cos(f.x * 0.018 + t * 1.1)) * wob * R * 0.004;
  vec2 uv = w / (2.0 * R) + 0.5;
  vec2 ca = dir * glass * 0.006 * pow(n, 3.0);                                        // colour fringing at the rim of the glass
  vec3 col = vec3(photo(uv + ca, defocus).r, photo(uv, defocus).g, photo(uv - ca, defocus).b);
  // light on the glass: a soft crescent upper left, a faint one lower right, a dark inner edge where the glass thickens
  float a1 = max(0.0, dot(dir, normalize(vec2(-0.6, -0.8))));
  float a2 = max(0.0, dot(dir, normalize(vec2(0.7, 0.7))));
  float rimBand = smoothstep(0.78, 0.95, n) * (1.0 - smoothstep(0.96, 1.0, n));
  col += vec3(1.0) * glass * (pow(a1, 3.0) * rimBand * 0.35 + pow(a2, 4.0) * rimBand * 0.12);
  float blob = smoothstep(0.34, 0.0, length(q / R - vec2(-0.34, -0.42)));             // a broad glint
  col += vec3(1.0) * glass * blob * 0.09;
  col *= 1.0 - glass * 0.22 * smoothstep(0.85, 1.0, n);
  col += vec3(1.0) * wave * 0.05;
  float edge = 1.0 - smoothstep(1.0 - 1.5 * dpr / R, 1.0, n);
  gl_FragColor = vec4(col, edge);
}`;
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; }
const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = (n) => gl.getUniformLocation(prog, n);
gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
function texture(unit, src, name) {
  return new Promise((res) => {
    const img = new Image(); img.onload = () => {
      const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.uniform1i(U(name), unit); res();
    }; img.src = src;
  });
}

/* ---------- layout: the holder, and the window in it (measured from the picture: centre 600,598 of 1254, radius ~276) ---------- */
const holder = document.getElementById("holder");
const HOLE = { x: 600 / 1254, y: 598 / 1254, r: 283 / 1254 };
let W = 0, Hh = 0, dpr = 1, S = 100, box = { x: 0, y: 0 }, C = { x: 0, y: 0 }, R = 50;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = canvas.clientWidth; Hh = canvas.clientHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(Hh * dpr); gl.viewport(0, 0, canvas.width, canvas.height);
  S = Math.min(W * 0.74, Hh * 0.72);
  box = { x: W / 2 - S * HOLE.x, y: Hh * 0.46 - S * HOLE.y };
  holder.style.left = box.x + "px"; holder.style.top = box.y + "px"; holder.style.width = S + "px";
  C = { x: box.x + S * HOLE.x, y: box.y + S * HOLE.y }; R = S * HOLE.r;
  const below = box.y + S * 0.97;
  for (const id of ["note", "hint", "dots"]) document.getElementById(id).style.top = (id === "dots" ? below - 4 : below + 14) + "px";
}
addEventListener("resize", resize); resize();

/* ---------- sound: a mechanical detent click, a little different each turn; a fuller one when it lands in focus ---------- */
let ac = null;
function clickSound(n, final) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume();
    const now = ac.currentTime, out = ac.createGain(); out.gain.value = final ? 0.42 : 0.32; out.connect(ac.destination);
    const tick = (at, freq, len, vol) => {
      const b = ac.createBuffer(1, Math.ceil(ac.sampleRate * len), ac.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
      const s = ac.createBufferSource(); s.buffer = b;
      const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 3.5;
      const g = ac.createGain(); g.gain.value = vol; s.connect(f); f.connect(g); g.connect(out); s.start(now + at);
    };
    const p = 1 + n * 0.06;
    tick(0, 3400 * p, 0.011, 1); tick(0.003, 1000 * p, 0.028, 0.5);
    if (final) { tick(0.045, 2500, 0.012, 0.7); tick(0.05, 700, 0.05, 0.45); }
    const o = ac.createOscillator(), og = ac.createGain();
    o.frequency.setValueAtTime(final ? 120 : 170 * p, now); o.frequency.exponentialRampToValueAtTime(55, now + 0.07);
    og.gain.setValueAtTime(final ? 0.5 : 0.28, now); og.gain.exponentialRampToValueAtTime(0.001, now + 0.09); o.connect(og); og.connect(out); o.start(now); o.stop(now + 0.11);
  } catch (_) {}
  try { navigator.vibrate && navigator.vibrate(final ? [12, 40, 10] : 8); } catch (_) {}
}

/* ---------- clicks turn the focus ---------- */
let T = 0, level = 0, defocus = 1, dv = 0, glass = 1, ripple = 0, rippleT = 9, press = 0, pressV = 0, tilt = 0, tiltV = 0, clean = false, cleanT = 0;
function turn() {
  if (clean) { if (cleanT > 0.8) reset(); return; }                         // in focus: a click starts it again
  level = Math.min(STEPS.length - 1, level + 1);
  const final = level === STEPS.length - 1;
  clickSound(level, final);
  ripple = final ? 1.3 : 1; rippleT = 0;
  pressV -= 1.6; tiltV += (level % 2 ? 1 : -1) * 2.2;                            // the holder gives a little and rocks
  if (final) { clean = true; cleanT = 0; }
  [...document.querySelectorAll(".dots i")].forEach((d, i) => d.classList.toggle("on", i < level));
}
function reset() {
  level = 0; clean = false; cleanT = 0; ripple = 0.8; rippleT = 0;
  document.getElementById("note").classList.remove("on");
  [...document.querySelectorAll(".dots i")].forEach((d) => d.classList.remove("on"));
}
document.getElementById("stage").addEventListener("pointerdown", turn);
addEventListener("keydown", (e) => { if (e.key === " " || e.key === "Enter") turn(); });

function step(dt) {
  T += dt; rippleT += dt; if (clean) cleanT += dt;
  // focus moves like a lens ring to its detent: a quick turn, a hair past, then back
  const target = STEPS[level];
  dv += ((target - defocus) * 90 - dv * 11) * dt; defocus += dv * dt;
  // the glass clears away once the picture is clean
  glass += ((clean ? 0 : 1) - glass) * (1 - Math.exp(-dt / (clean ? 0.7 : 0.3)));
  pressV += (-press * 260 - pressV * 18) * dt; press += pressV * dt;
  tiltV += (-tilt * 200 - tiltV * 12) * dt; tilt += tiltV * dt;
  holder.style.transform = `scale(${1 + press * 0.02}) rotate(${tilt * 0.5}deg)`;
  document.getElementById("note").classList.toggle("on", clean && cleanT > 1.0);
  document.getElementById("hint").classList.toggle("on", level === 0 && T > 1.4);
  document.getElementById("dots").style.opacity = level === 0 || (clean && cleanT > 1.0) ? 0 : 1;
}
function draw() {
  const e = Math.min(1, T / 1.2), enter = 1 - Math.pow(1 - e, 3);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(U("res"), canvas.width, canvas.height);
  gl.uniform2f(U("centre"), C.x * dpr, C.y * dpr); gl.uniform1f(U("R"), R * dpr * (1 + press * 0.02));
  gl.uniform1f(U("defocus"), Math.max(0, defocus)); gl.uniform1f(U("glass"), glass);
  gl.uniform1f(U("ripple"), ripple); gl.uniform1f(U("rippleT"), rippleT); gl.uniform1f(U("wob"), glass);
  gl.uniform1f(U("dpr"), dpr); gl.uniform1f(U("t"), T);
  canvas.style.opacity = enter; holder.style.opacity = enter;
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

document.getElementById("date").textContent = MEMORY.date;
document.getElementById("text").textContent = MEMORY.text;
let last = performance.now(), running = true;
document.addEventListener("visibilitychange", () => { running = !document.hidden; last = performance.now(); });
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!running) return;
  step(dt); draw();
}
holder.style.opacity = 0;
Promise.all([texture(0, "./focus/photo.jpg", "sharp"), texture(1, "./focus/blur-lo.jpg", "blurLo"), texture(2, "./focus/blur-hi.jpg", "blurHi")]).then(() => requestAnimationFrame(frame));
window.__focus = { get level() { return level; }, get clean() { return clean; }, get defocus() { return defocus; }, click: turn };
</script>
</body>
</html>
