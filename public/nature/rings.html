<!doctype html>
<html lang="en">
<head>
<script src="/nature/ios-audio.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Water rings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  .btns { position: absolute; left: 0; right: 0; bottom: 38px; display: flex; justify-content: center; gap: min(22vw, 190px); pointer-events: none; }
  .btn { all: unset; pointer-events: auto; width: 64px; height: 64px; border-radius: 22px; cursor: pointer; background: linear-gradient(#ffd84d, #f5b700); box-shadow: 0 7px 0 #c48a00, 0 12px 22px rgba(0, 40, 110, .28);
    transition: transform .08s, box-shadow .08s; touch-action: none; display: grid; place-items: center; }
  .btn::after { content: ""; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, rgba(255, 255, 255, .15) 60%); opacity: .8; }
  .btn.on { transform: translateY(6px); box-shadow: 0 1px 0 #c48a00, 0 4px 12px rgba(0, 40, 110, .25); }
  .hud { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font: 400 12px/1.4 "DM Sans", system-ui, sans-serif; color: rgba(20, 50, 100, .75); text-shadow: none; pointer-events: none; transition: opacity .6s; }
  .count { position: absolute; left: 16px; top: 14px; font: 500 13px/1 "DM Sans", system-ui, sans-serif; color: #14325f; text-shadow: none; pointer-events: none; letter-spacing: .02em; }
  .win { position: absolute; left: 50%; top: 14%; transform: translate(-50%, -10px); opacity: 0; font: 500 22px/1 "DM Sans", system-ui, sans-serif; color: #14325f; text-shadow: none; transition: opacity .5s, transform .6s cubic-bezier(.2, .9, .25, 1); pointer-events: none; }
  .win.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="count" id="count">0 / 8 on the poles</div>
<div class="win" id="win">all caught!</div>
<div class="btns"><button class="btn" id="bl" aria-label="Left spray"></button><button class="btn" id="br" aria-label="Right spray"></button></div>
<div class="hud" id="hud">hold the buttons to spray bubbles · push the rings up and over the poles</div>
<script>
const W = 1672, H = 941;
const BG_OPACITY = 0.5;                                        // how strong the underwater picture is over the white page
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const bg = new Image(); bg.src = "/nature/rings/reef.webp";
let vw = 0, vh = 0, dpr = 1, sc = 1, ox = 0, oy = 0;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2); vw = innerWidth; vh = innerHeight;
  cv.width = vw * dpr; cv.height = vh * dpr;
  sc = Math.min(vw / W, vh / H); ox = (vw - W * sc) / 2; oy = (vh - H * sc) / 2;
}
addEventListener("resize", resize); resize();

/* ---------- sound (follows the portfolio's sound switch) ---------- */
let ac = null, lastBlip = 0;
const muted = () => { try { return localStorage.getItem("ui-sound") === "off"; } catch (_) { return false; } };
const audio = () => { if (muted()) return null; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (_) {} return ac; };
function tone(f0, f1, len, vol, type = "sine") {
  const a = audio(); if (!a) return; const t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + len);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + len); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + len);
}
const blip = () => { const n = performance.now(); if (n - lastBlip < 70) return; lastBlip = n; tone(500 + Math.random() * 500, 900 + Math.random() * 600, 0.07, 0.035); };
const ting = () => { tone(880, 1320, 0.28, 0.07, "triangle"); setTimeout(() => tone(1320, 1760, 0.3, 0.05, "triangle"), 90); };

/* ---------- the toy ---------- */
const COLORS = [["#ff4a5a", "#b01a2b"], ["#36c24a", "#1a7a2c"], ["#ffd23f", "#c99700"], ["#ff7ab6", "#c23a82"], ["#3fd0b8", "#1d8f7c"]];
const R = 34;                                                 // ring radius
const FLOOR = (x) => 800 + Math.sin(x / 160) * 12 - 0;       // the sand
const rings = [];
const bubbles = [], pops = [];
const POLES = [{ x: 470, n: 0 }, { x: 1200, n: 0 }];            // two poles standing in the sand; the rings go over the top and slide down
const POLE_H = 300, PW = 8, TOTAL = 8;
const poleBase = (p) => FLOOR(p.x) - 4, poleTop = (p) => poleBase(p) - POLE_H;
const NOZ = { L: { x: 690, lean: -0.34 }, R: { x: 980, lean: 0.34 } };   // two nozzles in the sand, each leaning out towards its pole
let t = 0, jets = new Map(), won = 0, winT = 0;

function spawnRings() {
  rings.length = 0; POLES.forEach((p) => (p.n = 0));
  for (let i = 0; i < 8; i++) rings.push({ x: 560 + i * 80 + (Math.random() - 0.5) * 16, y: 700 + (i % 2) * 40, vx: 0, vy: 0, a: Math.random() * 6, va: 0, c: COLORS[i % COLORS.length], pole: -1, slot: 0 });
}
spawnRings();

function pop(x, y, r) { pops.push({ x, y, r, t: 0 }); }

function step(dt) {
  t += dt;
  // the jets: each finger or the mouse blows bubbles from the sand
  jets.forEach((j) => {
    j.acc += dt * 60;
    while (j.acc > 1) {
      j.acc -= 1;
      const r = 4 + Math.random() * 9;
      bubbles.push({ x: j.x + (Math.random() - 0.5) * 22, y: FLOOR(j.x) - 6, r, vx: j.lean * 230 + (Math.random() - 0.5) * 40, vy: -(170 + Math.random() * 140), ph: Math.random() * 6, life: 0 });
    }
  });
  // bubbles rise, wobble, and pop at the surface
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i]; b.life += dt;
    b.vy += (-60 - b.vy) * Math.min(1, dt * 0.6);              // they settle to a steady rise
    b.x += (b.vx + Math.sin(t * 5 + b.ph) * 26) * dt; b.y += b.vy * dt;
    if (b.y < 62 || b.life > 7) { pop(b.x, b.y, b.r); bubbles.splice(i, 1); }
  }
  // rings
  for (const g of rings) {
    if (g.pole >= 0) {                                         // threaded: it slides down the pole and stacks
      const pl = POLES[g.pole], ty = poleBase(pl) - 12 - g.slot * 17;
      g.x += (pl.x - g.x) * Math.min(1, dt * 14); g.vy = Math.min(g.vy + 900 * dt, 520);
      g.y = Math.min(ty, g.y + g.vy * dt); if (g.y >= ty && g.vy > 120) { g.vy = 0; blip(); }
      g.a += (Math.sin(t * 0.8 + g.slot) * 0.04 - g.a) * Math.min(1, dt * 4); g.vx = 0; continue;
    }
    // water: gentle sinking and a lot of drag
    g.vy += 230 * dt; const drag = Math.exp(-1.7 * dt); g.vx *= drag; g.vy *= drag;
    // each spray is a leaning column of moving water: it carries the rings up and out
    jets.forEach((j) => {
      const base = FLOOR(j.x), up = base - g.y; if (up < 0 || up > 640) return;
      const cx = j.x + j.lean * up, dx = g.x - cx, wid = 150 + up * 0.28;
      if (Math.abs(dx) < wid) { const f = (1 - Math.abs(dx) / wid) ** 1.2 * (1 - up / 520); g.vy -= 1700 * f * dt; g.vx += (j.lean * 560 - dx * 1.4) * f * dt; }
    });
    // bubbles shove it, and some of them pop on it
    for (const b of bubbles) {
      const dx = g.x - b.x, dy = g.y - b.y, d = Math.hypot(dx, dy);
      if (d < R + b.r && d > 0.01) {
        g.vy += b.vy * 0.05 * (b.r / 8); g.vx += (dx / d) * 18 * (b.r / 8); g.va += (dx > 0 ? 1 : -1) * 0.25;
        if (Math.random() < 0.22) { b.life = 99; blip(); }
      }
    }
    g.x += g.vx * dt; g.y += g.vy * dt; g.a += g.va * dt; g.va *= Math.exp(-1.2 * dt);
    // walls, surface, sand
    if (g.x < 50 + R) { g.x = 50 + R; g.vx = Math.abs(g.vx) * 0.5; } if (g.x > W - 50 - R) { g.x = W - 50 - R; g.vx = -Math.abs(g.vx) * 0.5; }
    if (g.y < 70 + R) { g.y = 70 + R; g.vy = Math.abs(g.vy) * 0.3; }
    const fl = FLOOR(g.x) - R * 0.7; if (g.y > fl) { g.y = fl; g.vy = -Math.abs(g.vy) * 0.25; g.vx *= 0.9; }
    // the poles: over the top and down onto one threads the ring, from the side it bumps into it
    for (let h = 0; h < POLES.length; h++) {
      const pl = POLES[h], top = poleTop(pl), dx = g.x - pl.x;
      if (g.y < top + 12 && g.y > top - 40 && g.vy > 0 && Math.abs(dx) < R * 0.55) {
        g.pole = h; g.slot = pl.n++; g.vy = Math.max(g.vy, 60); ting();
        for (let k = 0; k < 6; k++) pops.push({ x: pl.x + (Math.random() - 0.5) * 70, y: top + (Math.random() - 0.5) * 40, r: 4 + Math.random() * 6, t: -Math.random() * 0.15 });
        break;
      }
      if (g.y > top && g.y < poleBase(pl) + 10 && Math.abs(dx) < R + PW) { g.x = pl.x + Math.sign(dx || 1) * (R + PW); g.vx = Math.sign(dx || 1) * Math.abs(g.vx) * 0.4; }
    }
  }
  // rings push each other
  for (let i = 0; i < rings.length; i++) for (let j = i + 1; j < rings.length; j++) {
    const a = rings[i], b = rings[j]; if (a.pole >= 0 || b.pole >= 0) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = R * 1.75;
    if (d < min && d > 0.01) {
      const nx = dx / d, ny = dy / d, push = (min - d) / 2; a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
      const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny; if (rv < 0) { const k = -rv * 0.6; a.vx -= nx * k; a.vy -= ny * k; b.vx += nx * k; b.vy += ny * k; }
    }
  }
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; if (pops[i].t > 0.32) pops.splice(i, 1); }
  // everything caught: a little celebration, then the rings float free and it starts over
  const n = rings.filter((g) => g.pole >= 0).length;
  document.getElementById("count").textContent = `${n} / ${TOTAL} on the poles`;
  if (n === TOTAL && !won) { won = 1; winT = 0; document.getElementById("win").classList.add("on"); for (let k = 0; k < 40; k++) bubbles.push({ x: 200 + Math.random() * 1270, y: 780, r: 5 + Math.random() * 10, vx: 0, vy: -(120 + Math.random() * 200), ph: Math.random() * 6, life: 0 }); tone(523, 1046, 0.5, 0.06, "triangle"); }
  if (won) { winT += dt; if (winT > 4) { won = 0; document.getElementById("win").classList.remove("on"); spawnRings(); } }
}

/* ---------- drawing ---------- */
function drawRing(g, part) {                                   // part: "back" (far side of a threaded ring), "front", or the whole ring
  const a0 = part === "back" ? Math.PI : 0, a1 = part === "back" ? 6.2832 : part === "front" ? Math.PI : 6.2832;
  ctx.save(); ctx.translate(g.x, g.y);
  const tilt = g.pole >= 0 ? 0.42 : 0.78 + Math.sin(g.a) * 0.12;
  ctx.rotate(g.pole >= 0 ? 0 : g.a * 0.35); ctx.scale(1, tilt);
  ctx.shadowColor = "rgba(0, 20, 80, .35)"; ctx.shadowBlur = 8; ctx.shadowOffsetY = 5;
  ctx.lineWidth = 13; ctx.strokeStyle = g.c[1]; ctx.beginPath(); ctx.arc(0, 0, R, a0, a1); ctx.stroke();
  ctx.shadowColor = "transparent"; ctx.lineWidth = 9.5; ctx.strokeStyle = g.c[0]; ctx.beginPath(); ctx.arc(0, 0, R, a0, a1); ctx.stroke();
  if (part !== "front") { ctx.lineWidth = 2.5; ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.beginPath(); ctx.arc(0, 0, R - 1.5, 3.5, 4.7); ctx.stroke(); }
  ctx.restore();
}
function drawBubble(b) {
  ctx.save(); ctx.translate(b.x, b.y);
  const g = ctx.createRadialGradient(-b.r * 0.35, -b.r * 0.35, b.r * 0.1, 0, 0, b.r);
  g.addColorStop(0, "rgba(255,255,255,.55)"); g.addColorStop(0.7, "rgba(170,225,255,.12)"); g.addColorStop(1, "rgba(220,245,255,.5)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, b.r, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = "rgba(235,250,255,.75)"; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.beginPath(); ctx.arc(-b.r * 0.38, -b.r * 0.4, Math.max(1, b.r * 0.18), 0, 6.2832); ctx.fill();
  ctx.restore();
}
function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, vw, vh);
  ctx.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * ox, dpr * oy);
  if (bg.complete && bg.naturalWidth) { ctx.globalAlpha = BG_OPACITY; ctx.drawImage(bg, 0, 0, W, H); ctx.globalAlpha = 1; }
  // jet columns: a faint shimmer of moving water where you press
  jets.forEach((j) => { const y0 = FLOOR(j.x), y1 = y0 - 560, gx = ctx.createLinearGradient(0, y0, 0, y1); gx.addColorStop(0, "rgba(210,240,255,.34)"); gx.addColorStop(1, "rgba(210,240,255,0)");
    ctx.fillStyle = gx; ctx.beginPath(); ctx.moveTo(j.x - 22, y0); ctx.lineTo(j.x + j.lean * 560 - 120, y1); ctx.lineTo(j.x + j.lean * 560 + 120, y1); ctx.lineTo(j.x + 22, y0); ctx.fill(); });
  // the two nozzles in the sand
  for (const k of ["L", "R"]) { const n = NOZ[k], y = FLOOR(n.x); ctx.fillStyle = "rgba(60,40,10,.25)"; ctx.beginPath(); ctx.ellipse(n.x, y + 3, 26, 8, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = jets.has(k) ? "#ffe27a" : "#f5b700"; ctx.beginPath(); ctx.ellipse(n.x, y, 20, 7, 0, 0, 6.2832); ctx.fill(); ctx.fillStyle = "#6a4a00"; ctx.beginPath(); ctx.ellipse(n.x, y - 1, 10, 3.2, 0, 0, 6.2832); ctx.fill(); }
  for (const g of rings) if (g.pole < 0) drawRing(g);
  POLES.forEach((pl, h) => {
    const base = poleBase(pl), top = poleTop(pl);
    ctx.fillStyle = "rgba(60, 40, 10, .22)"; ctx.beginPath(); ctx.ellipse(pl.x, base + 2, 44, 11, 0, 0, 6.2832); ctx.fill();          // shadow on the sand
    const mine = rings.filter((g) => g.pole === h);
    mine.forEach((g) => drawRing(g, "back"));
    const gr = ctx.createLinearGradient(pl.x - PW, 0, pl.x + PW, 0); gr.addColorStop(0, "#ff9a4d"); gr.addColorStop(0.45, "#ffd0a0"); gr.addColorStop(1, "#e0661f");
    ctx.fillStyle = gr; ctx.beginPath(); ctx.roundRect(pl.x - PW, top, PW * 2, base - top, PW); ctx.fill();
    ctx.fillStyle = "#ff7a2a"; ctx.beginPath(); ctx.arc(pl.x, top, PW + 3, 0, 6.2832); ctx.fill();                                    // the cap
    ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.beginPath(); ctx.arc(pl.x - 3, top - 3, 3, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#e0661f"; ctx.beginPath(); ctx.ellipse(pl.x, base, 30, 9, 0, 0, 6.2832); ctx.fill();                              // the foot
    ctx.fillStyle = "#ff9a4d"; ctx.beginPath(); ctx.ellipse(pl.x, base - 2, 30, 8, 0, 0, 6.2832); ctx.fill();
    mine.forEach((g) => drawRing(g, "front"));
  });
  for (const b of bubbles) drawBubble(b);
  for (const p of pops) { if (p.t < 0) continue; const k = p.t / 0.32; ctx.strokeStyle = `rgba(235,250,255,${0.8 * (1 - k)})`; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + k * 0.9), 0, 6.2832); ctx.stroke(); }
}

let last = performance.now(), running = true;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.033, (now - last) / 1000); last = now; if (!running) return;
  step(dt); draw();
}
requestAnimationFrame(frame);
document.addEventListener("visibilitychange", () => { running = !document.hidden; last = performance.now(); });

/* ---------- input: two buttons, like the toy's. Hold one to spray from its nozzle ---------- */
const press = (k, on, id) => { if (on) { audio(); jets.set(k, { x: NOZ[k].x, lean: NOZ[k].lean, acc: 0 }); document.getElementById("hud").style.opacity = 0; } else jets.delete(k);
  document.getElementById(k === "L" ? "bl" : "br").classList.toggle("on", on); };
for (const [id, k] of [["bl", "L"], ["br", "R"]]) {
  const el = document.getElementById(id);
  el.addEventListener("pointerdown", (e) => { e.preventDefault(); el.setPointerCapture(e.pointerId); press(k, true); });
  const off = () => press(k, false);
  el.addEventListener("pointerup", off); el.addEventListener("pointercancel", off); el.addEventListener("lostpointercapture", off);
  el.addEventListener("contextmenu", (e) => e.preventDefault());
}
const KEYS = { ArrowLeft: "L", a: "L", A: "L", ArrowRight: "R", d: "R", D: "R" };
addEventListener("keydown", (e) => { const k = KEYS[e.key]; if (k && !e.repeat) { press(k, true); e.preventDefault(); } });
addEventListener("keyup", (e) => { const k = KEYS[e.key]; if (k) press(k, false); });
addEventListener("message", (e) => { if (e.data && e.data.away === true) { jets.clear(); document.querySelectorAll(".btn").forEach((b) => b.classList.remove("on")); } });
</script>
</body>
</html>
