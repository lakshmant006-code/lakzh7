<!doctype html>
<html lang="en">
<head>
<script src="/nature/ios-audio.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Water rings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  .hud { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font: 400 12px/1.4 "DM Sans", system-ui, sans-serif; color: rgba(20, 50, 100, .75); text-shadow: none; pointer-events: none; transition: opacity .6s; }
  .count { position: absolute; left: 16px; top: 14px; font: 500 13px/1 "DM Sans", system-ui, sans-serif; color: #14325f; text-shadow: none; pointer-events: none; letter-spacing: .02em; }
  .win { position: absolute; left: 50%; top: 14%; transform: translate(-50%, -10px); opacity: 0; font: 500 22px/1 "DM Sans", system-ui, sans-serif; color: #14325f; text-shadow: none; transition: opacity .5s, transform .6s cubic-bezier(.2, .9, .25, 1); pointer-events: none; }
  .win.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="count" id="count">0 / 6 caught</div>
<div class="win" id="win">all caught!</div>
<div class="hud" id="hud">press and hold to blow bubbles from below · lift the rings onto the octopus</div>
<script>
const W = 1672, H = 941;
const BG_OPACITY = 0.4;                                        // how strong the underwater picture is over the white page
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const bg = new Image(); bg.src = "/nature/rings/reef.webp";
let vw = 0, vh = 0, dpr = 1, sc = 1, ox = 0, oy = 0;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2); vw = innerWidth; vh = innerHeight;
  cv.width = vw * dpr; cv.height = vh * dpr;
  sc = Math.min(vw / W, vh / H); ox = (vw - W * sc) / 2; oy = (vh - H * sc) / 2;
}
addEventListener("resize", resize); resize();

/* ---------- sound (follows the portfolio's sound switch) ---------- */
let ac = null, lastBlip = 0;
const muted = () => { try { return localStorage.getItem("ui-sound") === "off"; } catch (_) { return false; } };
const audio = () => { if (muted()) return null; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (_) {} return ac; };
function tone(f0, f1, len, vol, type = "sine") {
  const a = audio(); if (!a) return; const t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + len);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + len); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + len);
}
const blip = () => { const n = performance.now(); if (n - lastBlip < 70) return; lastBlip = n; tone(500 + Math.random() * 500, 900 + Math.random() * 600, 0.07, 0.035); };
const ting = () => { tone(880, 1320, 0.28, 0.07, "triangle"); setTimeout(() => tone(1320, 1760, 0.3, 0.05, "triangle"), 90); };

/* ---------- the toy ---------- */
const COLORS = [["#ff4a5a", "#b01a2b"], ["#36c24a", "#1a7a2c"], ["#ffd23f", "#c99700"], ["#ff7ab6", "#c23a82"], ["#3fd0b8", "#1d8f7c"]];
const R = 34;                                                 // ring radius
const FLOOR = (x) => 800 + Math.sin(x / 160) * 12 - 0;       // the sand
const rings = [];
const bubbles = [], pops = [];
const octo = { x: 818, y: 440 };
const HOOKS = [[0, -112], [-126, -25], [-103, 65], [126, -25], [107, 60], [-44, 120]];   // where a ring can hang, relative to the octopus
const hookFilled = HOOKS.map(() => null);
let t = 0, jets = new Map(), won = 0, winT = 0;

function spawnRings() {
  rings.length = 0; hookFilled.fill(null);
  for (let i = 0; i < 8; i++) rings.push({ x: 300 + i * 150 + (Math.random() - 0.5) * 40, y: 640 + (i % 2) * 60, vx: 0, vy: 0, a: Math.random() * 6, va: 0, c: COLORS[i % COLORS.length], hook: -1, hx: 0, hy: 0 });
}
spawnRings();

function hookPos(i) { return [octo.x + HOOKS[i][0], octo.y + Math.sin(t * 1.3) * 8 + HOOKS[i][1]]; }

function pop(x, y, r) { pops.push({ x, y, r, t: 0 }); }

function step(dt) {
  t += dt;
  // the jets: each finger or the mouse blows bubbles from the sand
  jets.forEach((j) => {
    j.acc += dt * 42;
    while (j.acc > 1) {
      j.acc -= 1;
      const r = 4 + Math.random() * 9;
      bubbles.push({ x: j.x + (Math.random() - 0.5) * 38, y: FLOOR(j.x) - 6, r, vx: (Math.random() - 0.5) * 30, vy: -(150 + Math.random() * 130), ph: Math.random() * 6, life: 0 });
    }
  });
  // bubbles rise, wobble, and pop at the surface
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i]; b.life += dt;
    b.vy += (-60 - b.vy) * Math.min(1, dt * 0.6);              // they settle to a steady rise
    b.x += (b.vx + Math.sin(t * 5 + b.ph) * 26) * dt; b.y += b.vy * dt;
    if (b.y < 62 || b.life > 7) { pop(b.x, b.y, b.r); bubbles.splice(i, 1); }
  }
  // rings
  for (const g of rings) {
    if (g.hook >= 0) {                                         // caught: it hangs from its tentacle and sways
      const [hx, hy] = hookPos(g.hook);
      g.x += (hx - g.x) * Math.min(1, dt * 9); g.y += (hy + 16 - g.y) * Math.min(1, dt * 9);
      g.a += (Math.sin(t * 1.8 + g.hook) * 0.2 - g.a) * Math.min(1, dt * 3); g.vx = g.vy = 0; continue;
    }
    // water: gentle sinking and a lot of drag
    g.vy += 230 * dt; const drag = Math.exp(-1.7 * dt); g.vx *= drag; g.vy *= drag;
    // each jet is a column of moving water
    jets.forEach((j) => {
      const dx = g.x - j.x, top = FLOOR(j.x) - 640;
      if (Math.abs(dx) < 150 && g.y > top) { const f = (1 - Math.abs(dx) / 150) ** 1.3; g.vy -= 1700 * f * dt; g.vx += (dx / 120) * 260 * f * dt * 60 * 0.12; }
    });
    // bubbles shove it, and some of them pop on it
    for (const b of bubbles) {
      const dx = g.x - b.x, dy = g.y - b.y, d = Math.hypot(dx, dy);
      if (d < R + b.r && d > 0.01) {
        g.vy += b.vy * 0.05 * (b.r / 8); g.vx += (dx / d) * 18 * (b.r / 8); g.va += (dx > 0 ? 1 : -1) * 0.25;
        if (Math.random() < 0.22) { b.life = 99; blip(); }
      }
    }
    g.x += g.vx * dt; g.y += g.vy * dt; g.a += g.va * dt; g.va *= Math.exp(-1.2 * dt);
    // walls, surface, sand
    if (g.x < 50 + R) { g.x = 50 + R; g.vx = Math.abs(g.vx) * 0.5; } if (g.x > W - 50 - R) { g.x = W - 50 - R; g.vx = -Math.abs(g.vx) * 0.5; }
    if (g.y < 70 + R) { g.y = 70 + R; g.vy = Math.abs(g.vy) * 0.3; }
    const fl = FLOOR(g.x) - R * 0.7; if (g.y > fl) { g.y = fl; g.vy = -Math.abs(g.vy) * 0.25; g.vx *= 0.9; }
    // caught on a tentacle?
    for (let h = 0; h < HOOKS.length; h++) {
      if (hookFilled[h] !== null) continue;
      const [hx, hy] = hookPos(h);
      if (Math.hypot(g.x - hx, g.y - hy) < 30 && g.vy > -140) { g.hook = h; hookFilled[h] = g; ting(); for (let k = 0; k < 7; k++) pops.push({ x: hx + (Math.random() - 0.5) * 50, y: hy + (Math.random() - 0.5) * 50, r: 4 + Math.random() * 6, t: -Math.random() * 0.2 }); break; }
    }
  }
  // rings push each other
  for (let i = 0; i < rings.length; i++) for (let j = i + 1; j < rings.length; j++) {
    const a = rings[i], b = rings[j]; if (a.hook >= 0 || b.hook >= 0) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = R * 1.75;
    if (d < min && d > 0.01) {
      const nx = dx / d, ny = dy / d, push = (min - d) / 2; a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
      const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny; if (rv < 0) { const k = -rv * 0.6; a.vx -= nx * k; a.vy -= ny * k; b.vx += nx * k; b.vy += ny * k; }
    }
  }
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; if (pops[i].t > 0.32) pops.splice(i, 1); }
  // everything caught: a little celebration, then the rings float free and it starts over
  const n = hookFilled.filter(Boolean).length;
  document.getElementById("count").textContent = `${n} / ${HOOKS.length} caught`;
  if (n === HOOKS.length && !won) { won = 1; winT = 0; document.getElementById("win").classList.add("on"); for (let k = 0; k < 40; k++) bubbles.push({ x: 200 + Math.random() * 1270, y: 780, r: 5 + Math.random() * 10, vx: 0, vy: -(120 + Math.random() * 200), ph: Math.random() * 6, life: 0 }); tone(523, 1046, 0.5, 0.06, "triangle"); }
  if (won) { winT += dt; if (winT > 4) { won = 0; document.getElementById("win").classList.remove("on"); spawnRings(); } }
}

/* ---------- drawing ---------- */
function drawRing(g) {
  ctx.save(); ctx.translate(g.x, g.y);
  const tilt = g.hook >= 0 ? 0.62 : 0.78 + Math.sin(g.a) * 0.12;
  ctx.rotate(g.hook >= 0 ? g.a : g.a * 0.35); ctx.scale(1, tilt);
  ctx.shadowColor = "rgba(0, 20, 80, .35)"; ctx.shadowBlur = 8; ctx.shadowOffsetY = 5;
  ctx.lineWidth = 13; ctx.strokeStyle = g.c[1]; ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.2832); ctx.stroke();
  ctx.shadowColor = "transparent"; ctx.lineWidth = 9.5; ctx.strokeStyle = g.c[0]; ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.2832); ctx.stroke();
  ctx.lineWidth = 2.5; ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.beginPath(); ctx.arc(0, 0, R - 1.5, 3.5, 4.7); ctx.stroke();
  ctx.restore();
}
function drawBubble(b) {
  ctx.save(); ctx.translate(b.x, b.y);
  const g = ctx.createRadialGradient(-b.r * 0.35, -b.r * 0.35, b.r * 0.1, 0, 0, b.r);
  g.addColorStop(0, "rgba(255,255,255,.55)"); g.addColorStop(0.7, "rgba(170,225,255,.12)"); g.addColorStop(1, "rgba(220,245,255,.5)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, b.r, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = "rgba(235,250,255,.75)"; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.beginPath(); ctx.arc(-b.r * 0.38, -b.r * 0.4, Math.max(1, b.r * 0.18), 0, 6.2832); ctx.fill();
  ctx.restore();
}
function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, vw, vh);
  ctx.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * ox, dpr * oy);
  if (bg.complete && bg.naturalWidth) { ctx.globalAlpha = BG_OPACITY; ctx.drawImage(bg, 0, 0, W, H); ctx.globalAlpha = 1; }
  // jet columns: a faint shimmer of moving water where you press
  jets.forEach((j) => { const g = ctx.createLinearGradient(0, FLOOR(j.x), 0, 160); g.addColorStop(0, "rgba(210,240,255,.28)"); g.addColorStop(1, "rgba(210,240,255,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(j.x - 26, FLOOR(j.x)); ctx.lineTo(j.x - 70, 160); ctx.lineTo(j.x + 70, 160); ctx.lineTo(j.x + 26, FLOOR(j.x)); ctx.fill(); });
  // the octopus sways a little, on top of the picture (the picture's own octopus sits under it)
  for (const g of rings) if (g.hook < 0) drawRing(g);
  for (const g of rings) if (g.hook >= 0) drawRing(g);
  for (const b of bubbles) drawBubble(b);
  for (const p of pops) { if (p.t < 0) continue; const k = p.t / 0.32; ctx.strokeStyle = `rgba(235,250,255,${0.8 * (1 - k)})`; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + k * 0.9), 0, 6.2832); ctx.stroke(); }
}

let last = performance.now(), running = true;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.033, (now - last) / 1000); last = now; if (!running) return;
  step(dt); draw();
}
requestAnimationFrame(frame);
document.addEventListener("visibilitychange", () => { running = !document.hidden; last = performance.now(); });

/* ---------- input: mouse or fingers blow bubbles from the sand ---------- */
const world = (e) => [(e.clientX - ox) / sc, (e.clientY - oy) / sc];
cv.addEventListener("pointerdown", (e) => { audio(); cv.setPointerCapture(e.pointerId); const [x] = world(e); jets.set(e.pointerId, { x: Math.max(60, Math.min(W - 60, x)), acc: 0 }); document.getElementById("hud").style.opacity = 0; });
cv.addEventListener("pointermove", (e) => { const j = jets.get(e.pointerId); if (j) j.x = Math.max(60, Math.min(W - 60, world(e)[0])); });
const up = (e) => jets.delete(e.pointerId);
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
cv.addEventListener("contextmenu", (e) => e.preventDefault());
// keyboard: arrows move a jet, hold space to blow
let kx = W / 2, kdown = false;
addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") kx = Math.max(60, kx - 40); if (e.key === "ArrowRight") kx = Math.min(W - 60, kx + 40);
  if (e.key === " " && !kdown) { kdown = true; jets.set("kb", { x: kx, acc: 0 }); e.preventDefault(); }
  const j = jets.get("kb"); if (j) j.x = kx;
});
addEventListener("keyup", (e) => { if (e.key === " ") { kdown = false; jets.delete("kb"); } });
addEventListener("message", (e) => { if (e.data && e.data.away === true) { jets.clear(); } });
</script>
</body>
</html>
