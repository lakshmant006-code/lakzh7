<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mite Burrow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one square of damp soil seen from above, centred, with a caption row beneath. */
:root{
  --ground:#ffffff;
  --ink:#2c2420;
  --ink-soft:#8a7f73;
  --display:"Fraunces", Georgia, serif;
  --ui:"DM Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--ground:#ffffff;--ink:#2c2420;--ink-soft:#8a7f73;color-scheme:light}
}
:root[data-theme="dark"]{--ground:#ffffff;--ink:#2c2420;--ink-soft:#8a7f73;color-scheme:light}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:84px 190px;
  min-height:100vh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.stage{width:min(100%,720px);aspect-ratio:1;position:relative}
canvas{image-rendering:pixelated;width:100%;height:100%;display:block;touch-action:none;cursor:default;overflow:visible}
.cap{display:none!important;gap:12px 28px;flex-wrap:wrap;justify-content:center;font-size:13px;letter-spacing:.04em;color:var(--ink-soft)}
.cap b{font-family:var(--display);font-weight:600;color:var(--ink);letter-spacing:0}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Fraunces:opsz,wght@9..144,600&display=swap">

<div class="stage"><canvas id="c" aria-label="Plan view of damp dark soil with burrow holes. Fuzzy red mites crawl out of the holes. Press and hold the pointer on a mite and it curls up its legs."></canvas></div>
<div class="cap"><span><b>Move</b> the cursor over a mite</span><span><b>Press and hold</b> to make it curl up</span><span id="count">0 mites</span></div>

<script>
(function(){
const PIXEL=new URLSearchParams(location.search).has('px');
const W=640, dpr=PIXEL?.42:Math.min(2,window.devicePixelRatio||1);
const cv=document.getElementById('c'); cv.width=cv.height=W*dpr;
const ctx=cv.getContext('2d');
const rnd=(a,b)=>a+Math.random()*(b-a);
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const mk=()=>{const c=document.createElement('canvas');c.width=c.height=W*dpr;return c};
/* soft, irregular cloud mask: the scene fades into the page like a memory */
const maskC=mk();
(function(){
  const m=maskC.getContext('2d'); m.scale(dpr,dpr); m.filter='blur('+(30*dpr)+'px)'; m.fillStyle='#fff'; m.beginPath();
  for(let i=0;i<=140;i++){const t=i/140*6.2832;
    const r=W*.335*(1+.07*Math.sin(2*t+.6)+.06*Math.sin(3*t+1.3)+.04*Math.sin(5*t+2.1));
    const x=W/2+Math.cos(t)*r*1.02, y=W/2+Math.sin(t)*r*.92; i?m.lineTo(x,y):m.moveTo(x,y);}
  m.closePath(); m.fill();
})();

/* ---------- burrow holes ---------- */
const holes=[[128,150],[490,118],[300,330],[130,480],[505,440],[340,575]].map(([x,y])=>({x,y,r:rnd(15,19),last:-1e9,rot:rnd(0,3)}));

/* ---------- soil, wet patches and holes (static) ---------- */
const bg=mk();
(function(){
  const b=bg.getContext('2d');
  let g=b.createLinearGradient(0,0,W*dpr,W*dpr);
  g.addColorStop(0,'#98795f'); g.addColorStop(1,'#7a5f4a');
  b.fillStyle=g; b.fillRect(0,0,bg.width,bg.height);
  b.save(); b.scale(dpr,dpr);
  for(let i=0;i<110;i++){ // large tonal blotches
    const x=rnd(0,W), y=rnd(0,W), r=rnd(30,110), dark=Math.random()<.5;
    const gr=b.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,dark?'rgba(40,26,14,.08)':'rgba(190,150,115,.22)'); gr.addColorStop(1,'rgba(0,0,0,0)');
    b.fillStyle=gr; b.beginPath(); b.arc(x,y,r,0,7); b.fill();
  }
  // wet patches: darker, glossy
  const wet=[[250,150,70],[420,300,60],[110,330,55],[430,520,62],[560,250,45],[240,470,50]];
  wet.forEach(([wx,wy,wr])=>{
    for(let j=0;j<7;j++){
      const x=wx+rnd(-wr*.5,wr*.5), y=wy+rnd(-wr*.4,wr*.4), r=rnd(wr*.4,wr*.8);
      const gr=b.createRadialGradient(x,y,r*.2,x,y,r);
      gr.addColorStop(0,'rgba(30,20,12,.26)'); gr.addColorStop(.7,'rgba(30,20,12,.14)'); gr.addColorStop(1,'rgba(30,20,12,0)');
      b.fillStyle=gr; b.beginPath(); b.ellipse(x,y,r*1.2,r*.85,rnd(0,3),0,7); b.fill();
    }
    for(let j=0;j<5;j++){ // sheen
      const x=wx+rnd(-wr*.6,wr*.4), y=wy+rnd(-wr*.5,wr*.4), L=rnd(8,22), a=rnd(-.4,.2);
      b.strokeStyle='rgba(185,205,215,'+rnd(.12,.26)+')'; b.lineWidth=rnd(1.2,2.4); b.lineCap='round';
      b.beginPath(); b.arc(x,y,L,a,a+1.0); b.stroke();
    }
    for(let j=0;j<4;j++){ b.fillStyle='rgba(215,230,238,'+rnd(.2,.4)+')'; b.beginPath(); b.arc(wx+rnd(-wr*.6,wr*.5),wy+rnd(-wr*.5,wr*.5),rnd(.8,1.8),0,7); b.fill(); }
  });
  b.restore();
  const id=b.getImageData(0,0,bg.width,bg.height), d=id.data;
  for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*64+((Math.random()<.08)?(Math.random()-.5)*70:0); d[i]+=n; d[i+1]+=n*.9; d[i+2]+=n*.8;}
  b.putImageData(id,0,0);
  b.save(); b.scale(dpr,dpr);
  for(let i=0;i<2600;i++){ // clods and grit
    const x=rnd(0,W), y=rnd(0,W), r=rnd(.5,2.6), a=rnd(0,3);
    b.fillStyle='rgba(0,0,0,.35)'; b.beginPath(); b.ellipse(x+r*.5,y+r*.6,r,r*.8,a,0,7); b.fill();
    b.fillStyle='rgba('+(95+rnd(0,35))+','+(66+rnd(0,25))+','+(44+rnd(0,15))+','+rnd(.3,.6)+')';
    b.beginPath(); b.ellipse(x,y,r,r*.8,a,0,7); b.fill();
  }
  for(let i=0;i<22;i++){ // small stones
    const x=rnd(10,W-10), y=rnd(10,W-10), r=rnd(2.5,5.5);
    b.fillStyle='rgba(0,0,0,.3)'; b.beginPath(); b.ellipse(x+2,y+2.5,r*1.1,r*.85,0,0,7); b.fill();
    b.fillStyle='rgba(140,128,112,.55)'; b.beginPath(); b.ellipse(x,y,r,r*.8,rnd(0,3),0,7); b.fill();
    b.fillStyle='rgba(255,245,230,.25)'; b.beginPath(); b.ellipse(x-r*.3,y-r*.3,r*.4,r*.25,0,0,7); b.fill();
  }
  holes.forEach(h=>{
    let gr=b.createRadialGradient(h.x,h.y,h.r*.8,h.x,h.y,h.r*2.6);
    gr.addColorStop(0,'rgba(20,12,7,.34)'); gr.addColorStop(1,'rgba(20,12,7,0)');
    b.fillStyle=gr; b.beginPath(); b.arc(h.x,h.y,h.r*2.6,0,7); b.fill();
    for(let i=0;i<30;i++){ // crumbled rim
      const a=rnd(0,6.28), dd=h.r*rnd(1.0,1.55), r=rnd(1.4,4.2);
      const x=h.x+Math.cos(a)*dd, y=h.y+Math.sin(a)*dd;
      b.fillStyle='rgba(0,0,0,.4)'; b.beginPath(); b.ellipse(x+1,y+1.5,r,r*.8,a,0,7); b.fill();
      b.fillStyle='rgba('+(88+rnd(0,30))+','+(62+rnd(0,20))+','+(42+rnd(0,12))+',.8)'; b.beginPath(); b.ellipse(x,y,r,r*.8,a,0,7); b.fill();
    }
    gr=b.createRadialGradient(h.x-h.r*.25,h.y-h.r*.25,1,h.x,h.y,h.r);
    gr.addColorStop(0,'#000'); gr.addColorStop(.75,'#060302'); gr.addColorStop(1,'#1b100a');
    b.fillStyle=gr; b.beginPath(); b.ellipse(h.x,h.y,h.r,h.r*.92,h.rot,0,7); b.fill();
    b.strokeStyle='rgba(150,108,76,.35)'; b.lineWidth=1.6; b.beginPath(); b.arc(h.x,h.y,h.r-.5,.15*Math.PI,.75*Math.PI); b.stroke();
  });
  b.restore();
})();

/* ---------- grass tufts, seen from above (drawn over the mites) ---------- */
const grass=mk();
(function(){
  const c=grass.getContext('2d'); c.scale(dpr,dpr); c.lineCap='round';
  const tufts=[[88,84,14],[556,70,12],[40,330,11],[262,246,9],[582,372,13],[84,556,12],[430,598,10],[596,544,9],[210,60,8],[388,436,8]];
  const cols=['#3f7a24','#5c9a31','#7ab845','#2f5e1b','#8fcb58'];
  const blades=[];
  tufts.forEach(([x,y,n])=>{ for(let i=0;i<n;i++){ const a=(i/n)*6.28+rnd(-.3,.3), L=rnd(13,30); blades.push({x,y,a,L,bend:rnd(-.5,.5),w:rnd(1.8,2.8),col:cols[(Math.random()*cols.length)|0]}); } });
  const path=(o,dx,dy)=>{const tx=o.x+Math.cos(o.a)*o.L+dx,ty=o.y+Math.sin(o.a)*o.L+dy,mx=(o.x+tx)/2-Math.sin(o.a)*o.bend*o.L*.5,my=(o.y+ty)/2+Math.cos(o.a)*o.bend*o.L*.5;c.beginPath();c.moveTo(o.x+dx,o.y+dy);c.quadraticCurveTo(mx,my,tx,ty)};
  c.save(); c.filter='blur(1.5px)'; c.strokeStyle='rgba(0,0,0,.5)';
  blades.forEach(o=>{c.lineWidth=o.w+.8;path(o,3,4);c.stroke()}); c.restore();
  blades.forEach(o=>{c.strokeStyle=o.col;c.lineWidth=o.w;path(o,0,0);c.stroke();c.strokeStyle='rgba(255,255,200,.22)';c.lineWidth=o.w*.35;path(o,-.4,-.4);c.stroke()});
  tufts.forEach(([x,y])=>{c.fillStyle='#244a14';c.beginPath();c.arc(x,y,2.6,0,7);c.fill()});
})();

/* ---------- mite body sprite: smooth velvety red, grainy, drawn once ---------- */
const spr=document.createElement('canvas'); spr.width=280; spr.height=360;
(function(){
  const c=spr.getContext('2d'); c.save(); c.scale(2,2);
  const body=()=>{c.beginPath(); c.ellipse(70,102,38,54,0,0,7); c.moveTo(81,44); c.ellipse(70,44,11,9,0,0,7);};
  // head sits slightly darker, then the body over it
  c.fillStyle='#6e1b0d'; c.beginPath(); c.ellipse(70,44,11,9,0,0,7); c.fill();
  let g=c.createRadialGradient(56,80,4,70,104,62);
  g.addColorStop(0,'#cb4f2b'); g.addColorStop(.55,'#a8321a'); g.addColorStop(1,'#6a190c');
  c.fillStyle=g; c.beginPath(); c.ellipse(70,102,38,54,0,0,7); c.fill();
  c.save(); c.beginPath(); c.ellipse(70,102,38,54,0,0,7); c.clip();
  // creases and dimples
  c.filter='blur(1.6px)'; c.lineCap='round';
  c.strokeStyle='rgba(55,8,2,.55)'; c.lineWidth=3.2;
  c.beginPath(); c.moveTo(70,72); c.lineTo(70,138); c.stroke();
  c.lineWidth=2.4; c.strokeStyle='rgba(55,8,2,.4)';
  c.beginPath(); c.moveTo(48,90); c.quadraticCurveTo(70,84,92,90); c.stroke();
  c.beginPath(); c.moveTo(46,116); c.quadraticCurveTo(70,122,94,116); c.stroke();
  c.fillStyle='rgba(55,8,2,.4)';
  c.beginPath(); c.ellipse(47,100,5,7,.1,0,7); c.fill(); c.beginPath(); c.ellipse(93,100,5,7,-.1,0,7); c.fill();
  c.filter='none';
  // soft sheen
  const sh=c.createRadialGradient(54,72,2,56,76,30);
  sh.addColorStop(0,'rgba(255,170,130,.30)'); sh.addColorStop(1,'rgba(255,170,130,0)');
  c.fillStyle=sh; c.fillRect(0,0,140,200);
  // velvet nap: tiny strokes
  c.lineWidth=.7;
  for(let i=0;i<5200;i++){
    const x=rnd(30,110), y=rnd(46,156), a=rnd(0,6.28);
    c.strokeStyle=Math.random()<.5?'rgba(255,150,110,.22)':'rgba(60,8,2,.22)';
    c.beginPath(); c.moveTo(x,y); c.lineTo(x+Math.cos(a)*2.2,y+Math.sin(a)*2.2); c.stroke();
  }
  c.restore(); c.restore();
  // film grain over the whole sprite
  const id=c.getImageData(0,0,280,360), d=id.data;
  for(let i=0;i<d.length;i+=4){ if(d[i+3]>30){ const n=(Math.random()-.5)*52; d[i]+=n; d[i+1]+=n*.7; d[i+2]+=n*.6; } }
  c.putImageData(id,0,0);
})();

/* ---------- mites ---------- */
const mites=[]; let nextSpawn=400;
function spawn(now){
  const free=holes.filter(h=>now-h.last>3500); if(!free.length) return;
  const h=free[(Math.random()*free.length)|0]; h.last=now;
  mites.push({x:h.x,y:h.y,h:rnd(0,6.28),cur:0,turn:0,wait:0,lp:rnd(0,6),s:rnd(.85,1.1),t0:now,life:rnd(14000,26000),
    home:h,leave:false,dive:0,curl:0,hold:0,sc:.25});
}
function legs(c,m,k,mode){
  const L=[-34,-12,10,32], reach=[24,8,-8,-20], ext=[42,26,26,30], bend=[7,2,-3,-7], cu=m.curl;
  for(let side=-1;side<=1;side+=2) for(let i=0;i<4;i++){
    const ly=L[i], w=38*Math.sqrt(1-(ly/54)**2);
    const hx=-ly*k, hy=side*w*.8*k;
    const phi=m.lp+(((i+(side>0?1:0))%2)*Math.PI);
    let rx=hx+reach[i]*k+Math.cos(phi)*10*k*(1-cu);
    let ry=side*(w+ext[i])*k-side*Math.max(0,Math.sin(phi))*5*k;
    let kx=(hx+rx)/2+bend[i]*k, ky=(hy+ry)/2+side*9*k;
    const tx=hx+(reach[i]>0?3:-3)*k, ty=hy+side*7*k, qx=hx+(reach[i]>0?1:-1)*k, qy=hy+side*4*k;
    rx+=(tx-rx)*cu; ry+=(ty-ry)*cu; kx+=(qx-kx)*cu; ky+=(qy-ky)*cu;
    c.lineCap='round'; c.lineJoin='round';
    if(mode==='shadow'){
      c.strokeStyle='rgba(0,0,0,.6)'; c.lineWidth=4.6*k;
      c.beginPath(); c.moveTo(hx,hy); c.lineTo(kx,ky); c.lineTo(rx,ry); c.stroke();
    } else {
      c.strokeStyle='#a23722'; c.lineWidth=4.6*k; c.beginPath(); c.moveTo(hx,hy); c.lineTo(kx,ky); c.stroke();
      c.strokeStyle='#bb4f36'; c.lineWidth=3.4*k; c.beginPath(); c.moveTo(kx,ky); c.lineTo(rx,ry); c.stroke();
      c.fillStyle='#7b2313'; c.beginPath(); c.arc(kx,ky,2*k,0,7); c.fill();
      c.fillStyle='#d98c72'; c.beginPath(); c.arc(rx,ry,1.5*k,0,7); c.fill();
    }
  }
}
function drawMite(c,m,shadow){
  const k=.44*m.s*m.sc, cu=m.curl, along=1-.1*cu, across=1+.05*cu;
  c.save();
  if(shadow) c.translate(m.x+7*m.sc,m.y+9*m.sc); else c.translate(m.x,m.y);
  if(cu>.5) c.translate(rnd(-.35,.35),rnd(-.35,.35));
  c.rotate(m.h);
  legs(c,m,k,shadow?'shadow':'real');
  if(shadow){
    c.fillStyle='rgba(0,0,0,.6)';
    c.beginPath(); c.ellipse(0,0,50*k*1.04*along,40*k*1.04*across,0,0,7); c.fill();
    c.beginPath(); c.ellipse(57*k*along,0,12*k,11*k,0,0,7); c.fill();
  } else {
    c.rotate(Math.PI/2);
    c.drawImage(spr,-70*k*across,-100*k*along,140*k*across,180*k*along);
  }
  c.restore();
}

/* ---------- hand (drawn in code, index finger is the pointer) ---------- */
const H={x:W*.7,y:W*.75,a:0,press:0};
const P={x:W*.7,y:W*.75,on:false,down:false};
function drawHand(c,shadow){
  const skin=shadow?'#000':'#dfa98a', hi='#efc4a8', cr='rgba(130,72,50,.38)';
  c.lineCap='round'; c.lineJoin='round';
  const S=(x0,y0,x1,y1,w,col)=>{c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke()};
  // forearm and sleeve
  S(0,10,0,330,44,skin);
  if(!shadow){ S(0,150,0,360,64,'#34495f'); S(0,150,0,156,64,'#27394c'); }
  else S(0,150,0,360,64,'#000');
  // palm
  c.fillStyle=skin; c.beginPath(); c.ellipse(0,-2,32,38,0,0,7); c.fill();
  const fing=[[-19,-26,-.15,66,17],[-5,-31,-.04,38,17],[9,-31,.06,34,16],[22,-26,.17,28,14]];
  fing.forEach(([x,y,a,L,w])=>{ S(x,y,x+Math.sin(a)*L,y-Math.cos(a)*L,w,skin); });
  S(-27,8,-27+Math.sin(-1.15)*42,8-Math.cos(-1.15)*42,19,skin); // thumb
  if(shadow) return;
  c.fillStyle='rgba(255,200,170,.28)'; c.beginPath(); c.ellipse(-6,-8,20,24,0,0,7); c.fill();
  fing.forEach(([x,y,a,L,w],i)=>{
    const ux=Math.sin(a), uy=-Math.cos(a);
    S(x-1,y-1,x+ux*L-1,y+uy*L-1,w*.4,hi);
    [.45,.75].forEach(t=>{ if(i===0||t<.8){ const px=x+ux*L*t, py=y+uy*L*t; S(px-uy*w*.3,py+ux*w*.3,px+uy*w*.3,py-ux*w*.3,1.3,cr); }});
    const tx=x+ux*(L-5), ty=y+uy*(L-5); S(tx,ty,tx+ux*3.5,ty+uy*3.5,w*.55,'rgba(255,236,226,.8)');
  });
  S(-27,8,-27+Math.sin(-1.15)*30,8-Math.cos(-1.15)*30,7,hi);
}
const TIP=[-19+Math.sin(-.15)*66,-26-Math.cos(-.15)*66], HR=-.38;

/* ---------- pointer ---------- */
function setP(e){const r=cv.getBoundingClientRect();P.x=(e.clientX-r.left)/r.width*W;P.y=(e.clientY-r.top)/r.height*W;P.on=true}
cv.addEventListener('pointermove',setP);
cv.addEventListener('pointerdown',e=>{setP(e);P.down=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
const up=()=>{P.down=false};
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',()=>{if(!P.down)P.on=false});

/* ---------- behaviour ---------- */
const FOOT=30;
function step(m,dt,now){
  const age=now-m.t0, e=Math.min(1,age/1500);
  m.sc=(.25+.75*(1-Math.pow(1-e,3)))*(1-m.dive);
  const under=P.on&&H.press>.5&&Math.hypot(m.x-P.x,m.y-P.y)<FOOT;
  if(under) m.hold=500; else if(m.hold>0) m.hold-=dt;
  const tgt=(under||m.hold>0)?1:0;
  m.curl+=(tgt-m.curl)*(tgt?.22:.05);
  if(m.curl<.01&&!tgt) m.curl=0;
  if(m.curl>.25){m.cur*=.8;return}
  if(m.wait>0){m.wait-=dt;m.cur*=.88;return}
  if(!m.leave&&age>m.life) m.leave=true;
  if(Math.random()<.02) m.turn=rnd(-.05,.05);
  let want=m.h+m.turn, rate=.05, spd=.38;
  if(age<1500){spd=.5;}
  else if(m.leave){
    const dx=m.home.x-m.x, dy=m.home.y-m.y, d=Math.hypot(dx,dy);
    want=m.h+wrap(Math.atan2(dy,dx)-m.h); rate=.08; spd=.7;
    if(d<12) m.dive+=dt/650;
  } else {
    for(const o of mites){ if(o===m) continue;
      const dx=o.x-m.x, dy=o.y-m.y, d=Math.hypot(dx,dy);
      if(d<62) want+=wrap(Math.atan2(-dy,-dx)-m.h)*.07; }
    if(Math.hypot(m.x-W/2,m.y-W/2)>215) want+=wrap(Math.atan2(W/2-m.y,W/2-m.x)-m.h)*.1;
    if(Math.random()<.0016) m.wait=rnd(500,1700);
  }
  m.h+=wrap(want-m.h)*rate;
  m.cur+=(spd*.8-m.cur)*.06;
  const sp=m.cur*dt*.06*(RM?.5:1);
  m.x+=Math.cos(m.h)*sp; m.y+=Math.sin(m.h)*sp; m.lp+=sp*.16;
}

/* ---------- loop ---------- */
const sh=mk(), sx=sh.getContext('2d');
const cnt=document.getElementById('count'); let last=performance.now();
function frame(now){
  const dt=Math.min(40,now-last); last=now;
  if(now>nextSpawn && mites.length<7){ spawn(now); nextSpawn=now+(mites.length<4?900:rnd(2500,6000)); }
  H.x+=(P.x-H.x)*.35; H.y+=(P.y-H.y)*.35;
  H.a+=((P.on?1:0)-H.a)*.12;
  H.press+=((P.down?1:0)-H.press)*.28;
  mites.forEach(m=>step(m,dt,now));
  for(let i=mites.length-1;i>=0;i--) if(mites[i].dive>=1) mites.splice(i,1);

  ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(bg,0,0);
  sx.setTransform(1,0,0,1,0,0); sx.clearRect(0,0,sh.width,sh.height); sx.setTransform(dpr,0,0,dpr,0,0);
  mites.forEach(m=>drawMite(sx,m,true));
  ctx.filter='blur('+(2.4*dpr)+'px)'; ctx.drawImage(sh,0,0); ctx.filter='none';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  mites.slice().sort((a,b)=>a.y-b.y).forEach(m=>drawMite(ctx,m,false));
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation='destination-in'; ctx.drawImage(maskC,0,0); ctx.globalCompositeOperation='source-over';
  ctx.setTransform(dpr,0,0,dpr,0,0);

  if(H.a>.02){
    ctx.save(); ctx.globalAlpha=H.a;
    if(H.press>.05){ // soil dents under the fingertip
      const gr=ctx.createRadialGradient(P.x,P.y,0,P.x,P.y,FOOT);
      gr.addColorStop(0,'rgba(0,0,0,'+(.3*H.press)+')'); gr.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(P.x,P.y,FOOT,0,7); ctx.fill();
      ctx.strokeStyle='rgba(255,235,215,'+(.35*H.press)+')'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(P.x,P.y,FOOT,0,7); ctx.stroke();
    }
    ctx.restore();
  }
  cnt.textContent=mites.length+(mites.length===1?' mite':' mites');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
