<!doctype html><html><head>
<script src="/nature/ios-audio.js"></script><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#f5f3ef;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rainy velvets</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one square of damp soil seen from above, centred, with a caption row beneath. */
:root{
  --ground:#f5f3ef;
  --ink:#2c2420;
  --ink-soft:#8a7f73;
  --display:"Fraunces", Georgia, serif;
  --ui:"DM Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--ground:#f5f3ef;--ink:#2c2420;--ink-soft:#8a7f73;color-scheme:light}
}
:root[data-theme="dark"]{--ground:#f5f3ef;--ink:#2c2420;--ink-soft:#8a7f73;color-scheme:light}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;
  min-height:100vh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.stage{width:100%;height:100%;position:fixed;inset:0}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:default;overflow:visible}
.cap{display:none!important;gap:12px 28px;flex-wrap:wrap;justify-content:center;font-size:13px;letter-spacing:.04em;color:var(--ink-soft)}
.cap b{font-family:var(--display);font-weight:600;color:var(--ink);letter-spacing:0}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Fraunces:opsz,wght@9..144,600&display=swap">

<div class="stage"><canvas id="c" aria-label="Plan view of damp dark soil with burrow holes. Fuzzy red mites crawl out of the holes. Press and hold the pointer on a mite and it curls up its legs."></canvas></div>
<div class="cap"><span><b>Move</b> the cursor over a mite</span><span><b>Press and hold</b> to make it curl up</span><span id="count">0 mites</span></div>

<script>
(function(){
const PIXEL=new URLSearchParams(location.search).has('px');
const WY=640, ASP=Math.max(.7,Math.min(2.4,innerWidth/Math.max(1,innerHeight))), WX=Math.round(WY*ASP), W=WY, dpr=PIXEL?.42:Math.min(2,window.devicePixelRatio||1);
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>location.reload(),350)});
const cv=document.getElementById('c'); cv.width=WX*dpr;cv.height=WY*dpr;
const ctx=cv.getContext('2d');
const rnd=(a,b)=>a+Math.random()*(b-a);
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const mk=()=>{const c=document.createElement('canvas');c.width=WX*dpr;c.height=WY*dpr;return c};
/* soft, irregular cloud mask: the scene fades into the page like a memory */
const maskC=mk();
(function(){
  const m=maskC.getContext('2d'); m.scale(dpr,dpr); m.filter='blur('+(30*dpr)+'px)'; m.fillStyle='#fff'; m.beginPath();
  for(let i=0;i<=140;i++){const t=i/140*6.2832;
    const r=W*.4*(1+.07*Math.sin(2*t+.6)+.06*Math.sin(3*t+1.3)+.04*Math.sin(5*t+2.1));
    const x=W/2+Math.cos(t)*r*1.02, y=W/2+Math.sin(t)*r*.92; i?m.lineTo(x,y):m.moveTo(x,y);}
  m.closePath(); m.fill();
})();

/* ---------- burrow holes ---------- */
const holes=[[.2,.23],[.77,.19],[.47,.52],[.2,.75],[.79,.69],[.53,.9],[.9,.4],[.07,.45]].slice(0,ASP>1.5?8:6).map(([fx,fy])=>({x:fx*WX,y:fy*WY,r:rnd(15,19),last:-1e9,rot:rnd(0,3)}));

/* ---------- soil, wet patches and holes (static) ---------- */
const bg=mk();
(function(){
  const b=bg.getContext('2d');
  let g=b.createLinearGradient(0,0,WX*dpr,WY*dpr);
  g.addColorStop(0,'#98795f'); g.addColorStop(1,'#7a5f4a');
  b.fillStyle=g; b.fillRect(0,0,bg.width,bg.height);
  b.save(); b.scale(dpr,dpr);
  for(let i=0;i<110;i++){ // large tonal blotches
    const x=rnd(0,WX), y=rnd(0,WY), r=rnd(30,110), dark=Math.random()<.5;
    const gr=b.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,dark?'rgba(40,26,14,.08)':'rgba(190,150,115,.22)'); gr.addColorStop(1,'rgba(0,0,0,0)');
    b.fillStyle=gr; b.beginPath(); b.arc(x,y,r,0,7); b.fill();
  }
  // wet patches: darker, glossy
  const wet=[[.39,.23,70],[.66,.47,60],[.17,.52,55],[.67,.81,62],[.87,.39,45],[.37,.73,50],[.55,.12,50],[.3,.9,48]].map(([fx,fy,r])=>[fx*WX,fy*WY,r]);
  wet.forEach(([wx,wy,wr])=>{
    for(let j=0;j<7;j++){
      const x=wx+rnd(-wr*.5,wr*.5), y=wy+rnd(-wr*.4,wr*.4), r=rnd(wr*.4,wr*.8);
      const gr=b.createRadialGradient(x,y,r*.2,x,y,r);
      gr.addColorStop(0,'rgba(30,20,12,.26)'); gr.addColorStop(.7,'rgba(30,20,12,.14)'); gr.addColorStop(1,'rgba(30,20,12,0)');
      b.fillStyle=gr; b.beginPath(); b.ellipse(x,y,r*1.2,r*.85,rnd(0,3),0,7); b.fill();
    }
    for(let j=0;j<5;j++){ // sheen
      const x=wx+rnd(-wr*.6,wr*.4), y=wy+rnd(-wr*.5,wr*.4), L=rnd(8,22), a=rnd(-.4,.2);
      b.strokeStyle='rgba(185,205,215,'+rnd(.12,.26)+')'; b.lineWidth=rnd(1.2,2.4); b.lineCap='round';
      b.beginPath(); b.arc(x,y,L,a,a+1.0); b.stroke();
    }
    for(let j=0;j<4;j++){ b.fillStyle='rgba(215,230,238,'+rnd(.2,.4)+')'; b.beginPath(); b.arc(wx+rnd(-wr*.6,wr*.5),wy+rnd(-wr*.5,wr*.5),rnd(.8,1.8),0,7); b.fill(); }
  });
  b.restore();
  const id=b.getImageData(0,0,bg.width,bg.height), d=id.data;
  for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*64+((Math.random()<.08)?(Math.random()-.5)*70:0); d[i]+=n; d[i+1]+=n*.9; d[i+2]+=n*.8;}
  b.putImageData(id,0,0);
  b.save(); b.scale(dpr,dpr);
  for(let i=0;i<2600;i++){ // clods and grit
    const x=rnd(0,WX), y=rnd(0,WY), r=rnd(.5,2.6), a=rnd(0,3);
    b.fillStyle='rgba(0,0,0,.35)'; b.beginPath(); b.ellipse(x+r*.5,y+r*.6,r,r*.8,a,0,7); b.fill();
    b.fillStyle='rgba('+(95+rnd(0,35))+','+(66+rnd(0,25))+','+(44+rnd(0,15))+','+rnd(.3,.6)+')';
    b.beginPath(); b.ellipse(x,y,r,r*.8,a,0,7); b.fill();
  }
  for(let i=0;i<22;i++){ // small stones
    const x=rnd(10,WX-10), y=rnd(10,WY-10), r=rnd(2.5,5.5);
    b.fillStyle='rgba(0,0,0,.3)'; b.beginPath(); b.ellipse(x+2,y+2.5,r*1.1,r*.85,0,0,7); b.fill();
    b.fillStyle='rgba(140,128,112,.55)'; b.beginPath(); b.ellipse(x,y,r,r*.8,rnd(0,3),0,7); b.fill();
    b.fillStyle='rgba(255,245,230,.25)'; b.beginPath(); b.ellipse(x-r*.3,y-r*.3,r*.4,r*.25,0,0,7); b.fill();
  }
  holes.forEach(h=>{
    let gr=b.createRadialGradient(h.x,h.y,h.r*.8,h.x,h.y,h.r*2.6);
    gr.addColorStop(0,'rgba(20,12,7,.34)'); gr.addColorStop(1,'rgba(20,12,7,0)');
    b.fillStyle=gr; b.beginPath(); b.arc(h.x,h.y,h.r*2.6,0,7); b.fill();
    for(let i=0;i<30;i++){ // crumbled rim
      const a=rnd(0,6.28), dd=h.r*rnd(1.0,1.55), r=rnd(1.4,4.2);
      const x=h.x+Math.cos(a)*dd, y=h.y+Math.sin(a)*dd;
      b.fillStyle='rgba(0,0,0,.4)'; b.beginPath(); b.ellipse(x+1,y+1.5,r,r*.8,a,0,7); b.fill();
      b.fillStyle='rgba('+(88+rnd(0,30))+','+(62+rnd(0,20))+','+(42+rnd(0,12))+',.8)'; b.beginPath(); b.ellipse(x,y,r,r*.8,a,0,7); b.fill();
    }
    gr=b.createRadialGradient(h.x-h.r*.25,h.y-h.r*.25,1,h.x,h.y,h.r);
    gr.addColorStop(0,'#000'); gr.addColorStop(.75,'#060302'); gr.addColorStop(1,'#1b100a');
    b.fillStyle=gr; b.beginPath(); b.ellipse(h.x,h.y,h.r,h.r*.92,h.rot,0,7); b.fill();
    b.strokeStyle='rgba(150,108,76,.35)'; b.lineWidth=1.6; b.beginPath(); b.arc(h.x,h.y,h.r-.5,.15*Math.PI,.75*Math.PI); b.stroke();
  });
  b.restore();
})();

/* ---------- grass tufts, seen from above (drawn over the mites) ---------- */
const grass=mk();
(function(){
  const c=grass.getContext('2d'); c.scale(dpr,dpr); c.lineCap='round';
  const tufts=[[88,84,14],[556,70,12],[40,330,11],[262,246,9],[582,372,13],[84,556,12],[430,598,10],[596,544,9],[210,60,8],[388,436,8]];
  const cols=['#3f7a24','#5c9a31','#7ab845','#2f5e1b','#8fcb58'];
  const blades=[];
  tufts.forEach(([x,y,n])=>{ for(let i=0;i<n;i++){ const a=(i/n)*6.28+rnd(-.3,.3), L=rnd(13,30); blades.push({x,y,a,L,bend:rnd(-.5,.5),w:rnd(1.8,2.8),col:cols[(Math.random()*cols.length)|0]}); } });
  const path=(o,dx,dy)=>{const tx=o.x+Math.cos(o.a)*o.L+dx,ty=o.y+Math.sin(o.a)*o.L+dy,mx=(o.x+tx)/2-Math.sin(o.a)*o.bend*o.L*.5,my=(o.y+ty)/2+Math.cos(o.a)*o.bend*o.L*.5;c.beginPath();c.moveTo(o.x+dx,o.y+dy);c.quadraticCurveTo(mx,my,tx,ty)};
  c.save(); c.filter='blur(1.5px)'; c.strokeStyle='rgba(0,0,0,.5)';
  blades.forEach(o=>{c.lineWidth=o.w+.8;path(o,3,4);c.stroke()}); c.restore();
  blades.forEach(o=>{c.strokeStyle=o.col;c.lineWidth=o.w;path(o,0,0);c.stroke();c.strokeStyle='rgba(255,255,200,.22)';c.lineWidth=o.w*.35;path(o,-.4,-.4);c.stroke()});
  tufts.forEach(([x,y])=>{c.fillStyle='#244a14';c.beginPath();c.arc(x,y,2.6,0,7);c.fill()});
})();

/* ---------- mites: the real velvet mite, cut into a body, eight legs and a pair of palps, walking like an arthropod ---------- */
const mites=[]; let nextSpawn=400; window.__mites=mites;
const MA={ready:false,img:null,sil:null,j:null};
{ const a=new Image(), b=new Image();
  let got=0; const ok=()=>{ if(++got===3) MA.ready=true; };
  a.onload=ok; b.onload=ok; a.src='./mites/mite.png'; b.src='./mites/mite-sil.png';
  fetch('./mites/mite.json').then(r=>r.json()).then(j=>{MA.j=j; MA.body=j.items.find(i=>i.kind==='body'); MA.legs=j.items.filter(i=>i.kind==='leg'); MA.palps=j.items.find(i=>i.kind==='palp'); ok();});
  MA.img=a; MA.sil=b; }
const MS=.085;                        // world units per source pixel: a mite is ~90 units across
const STRIDE=11;                      // ground covered by one full leg cycle (foot planted = no sliding)
function spawn(now){
  if(!MA.ready) return;
  const free=holes.filter(h=>now-h.last>3500); if(!free.length) return;
  const h=free[(Math.random()*free.length)|0]; h.last=now;
  const hd=rnd(0,6.28);
  mites.push({x:h.x,y:h.y,h:hd,s:rnd(.85,1.1),t0:now,life:rnd(16000,28000),home:h,leave:false,dive:0,curl:0,hold:0,sc:.25,
    state:'walk',st:rnd(.8,2),speed:0,yaw:0,ph:rnd(0,1),turnNoise:rnd(-.3,.3),goal:hd,wob:0,probe:rnd(0,6),flee:0,rock:0,ox:0,oy:0,vx:0,vy:0,sA:0,sV:0,sq:0,sqV:0,pressed:false});
}
// leg angle across one cycle: stance sweeps the foot back at constant speed, swing snaps it forward and lifts it
function gait(p){
  p=p-Math.floor(p); const ST=.62;
  if(p<ST) return {a:1-2*(p/ST),lift:0};
  const q=(p-ST)/(1-ST), e=q*q*(3-2*q);
  return {a:-1+2*e,lift:Math.sin(q*Math.PI)};
}
function drawPieces(c,m,atlas,sh){
  const k=MS*m.s*m.sc, cu=m.curl, j=MA.j, sc=j.sc, th0=j.theta0;
  const spd=Math.min(1,m.speed/18);
  c.save();
  if(sh) c.translate(m.x+m.ox+7*m.sc,m.y+m.oy+9*m.sc); else c.translate(m.x+m.ox,m.y+m.oy);
  if(cu>.5) c.translate(rnd(-.28,.28)*cu,rnd(-.28,.28)*cu);
  c.rotate(m.h-th0+m.rock+m.sA);
  { const q=1+m.sq; c.scale(q,q); }
  const draw=(it,ang,scl,lift)=>{
    c.save();
    const hx=(it.hx??0)*k, hy=(it.hy??0)*k;
    c.translate(hx,hy); c.rotate(ang); const f=scl*(1+.05*lift); c.scale(f,f);
    c.drawImage(atlas,it.ax,it.ay,it.sw,it.sh,(it.ox-(it.hx??0))*k,(it.oy-(it.hy??0))*k,it.w*k,it.h*k);
    c.restore();
  };
  // legs first (they sit under the body): tetrapod gait, outside legs stride wider when turning
  for(const it of MA.legs){
    const grp=((it.side>0?it.idx:it.idx+1)%2), ph=m.ph+grp*.5+it.idx*.025;
    const g=gait(ph), amp=(.30-it.idx*.03)*(1+(it.side>0?1:-1)*m.yaw*.18)*(.25+.75*spd);
    let ang=it.swing*g.a*amp*(m.state==='pause'?.0:1);
    // while stopped, the front pair waves about to feel what's ahead
    if(m.state==='pause'&&it.idx===0) ang+=it.swing*Math.sin(now_t*9+m.probe+it.side*1.7)*.16;
    ang=ang*(1-cu)+cu*-it.swing*.9;                       // curled: legs fold in against the body
    draw(it,ang,1-cu*.42,g.lift);
  }
  if(sh){ c.restore(); return; }                           // only the legs cast a drop shadow: the body sits right on the soil
  c.save(); const bs=1-.07*cu; c.scale(bs,bs);
  draw(MA.body,0,1,0);
  c.restore();
  const pal=MA.palps; draw(pal,Math.sin(now_t*21+m.probe)*.07*(m.state==='pause'?2.2:1)+(m.state==='pause'?Math.sin(now_t*5.5+m.probe)*.05:0),1-cu*.3,0);
  c.restore();
}
let now_t=0;
function drawMite(c,m,shadow){
  if(!MA.ready) return;
  drawPieces(c,m,shadow?MA.sil:MA.img,shadow);
}

/* ---------- hand (drawn in code, index finger is the pointer) ---------- */
const H={x:WX*.7,y:WY*.75,a:0,press:0};
const P={x:WX*.7,y:WY*.75,on:false,down:false};
function drawHand(c,shadow){
  const skin=shadow?'#000':'#dfa98a', hi='#efc4a8', cr='rgba(130,72,50,.38)';
  c.lineCap='round'; c.lineJoin='round';
  const S=(x0,y0,x1,y1,w,col)=>{c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke()};
  // forearm and sleeve
  S(0,10,0,330,44,skin);
  if(!shadow){ S(0,150,0,360,64,'#34495f'); S(0,150,0,156,64,'#27394c'); }
  else S(0,150,0,360,64,'#000');
  // palm
  c.fillStyle=skin; c.beginPath(); c.ellipse(0,-2,32,38,0,0,7); c.fill();
  const fing=[[-19,-26,-.15,66,17],[-5,-31,-.04,38,17],[9,-31,.06,34,16],[22,-26,.17,28,14]];
  fing.forEach(([x,y,a,L,w])=>{ S(x,y,x+Math.sin(a)*L,y-Math.cos(a)*L,w,skin); });
  S(-27,8,-27+Math.sin(-1.15)*42,8-Math.cos(-1.15)*42,19,skin); // thumb
  if(shadow) return;
  c.fillStyle='rgba(255,200,170,.28)'; c.beginPath(); c.ellipse(-6,-8,20,24,0,0,7); c.fill();
  fing.forEach(([x,y,a,L,w],i)=>{
    const ux=Math.sin(a), uy=-Math.cos(a);
    S(x-1,y-1,x+ux*L-1,y+uy*L-1,w*.4,hi);
    [.45,.75].forEach(t=>{ if(i===0||t<.8){ const px=x+ux*L*t, py=y+uy*L*t; S(px-uy*w*.3,py+ux*w*.3,px+uy*w*.3,py-ux*w*.3,1.3,cr); }});
    const tx=x+ux*(L-5), ty=y+uy*(L-5); S(tx,ty,tx+ux*3.5,ty+uy*3.5,w*.55,'rgba(255,236,226,.8)');
  });
  S(-27,8,-27+Math.sin(-1.15)*30,8-Math.cos(-1.15)*30,7,hi);
}
const TIP=[-19+Math.sin(-.15)*66,-26-Math.cos(-.15)*66], HR=-.38;

/* ---------- pointer ---------- */
/* ---------- sound: rain ticking on the leaves, tiny feet, a tap on the soil. Synthesised, quiet, off with the site's sound toggle ---------- */
const SND=(()=>{
  let ctx=null,master=null,buf=null,rainG=null,started=false,creeps=0,creepWin=0;
  const off=()=>{try{return localStorage.getItem('ui-sound')==='off'}catch(_){return false}};
  function noise(t,dur,type,f,q,peak,att,pan){
    const s=ctx.createBufferSource(); s.buffer=buf; s.loop=true;
    const fl=ctx.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q;
    const g=ctx.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+att); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(fl); fl.connect(g);
    if(pan!=null&&ctx.createStereoPanner){ const p=ctx.createStereoPanner(); p.pan.value=Math.max(-1,Math.min(1,pan)); g.connect(p); p.connect(master); } else g.connect(master);
    s.start(t,Math.random()*1.5); s.stop(t+dur+.05);
  }
  function tone(t,f0,f1,dur,peak,pan){
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+.006); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); if(pan!=null&&ctx.createStereoPanner){ const p=ctx.createStereoPanner(); p.pan.value=pan; g.connect(p); p.connect(master); } else g.connect(master);
    o.start(t); o.stop(t+dur+.05);
  }
  function start(){
    if(started) return; started=true;
    // a light, steady rain bed, and drops that tick now and then
    const s=ctx.createBufferSource(); s.buffer=buf; s.loop=true;
    const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=2200; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=8000;
    rainG=ctx.createGain(); rainG.gain.value=0; s.connect(hp); hp.connect(lp); lp.connect(rainG); rainG.connect(master); s.start();
    rainG.gain.linearRampToValueAtTime(.022,ctx.currentTime+2.5);
    (function drip(){ if(!document.hidden&&!off()&&ctx){ const t=ctx.currentTime, pan=Math.random()*2-1; tone(t,1500+Math.random()*1800,900+Math.random()*500,.05,.006+Math.random()*.006,pan); }
      setTimeout(drip,160+Math.random()*520); })();
  }
  return {
    unlock(){
      if(!ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; ctx=new AC(); master=ctx.createGain(); master.gain.value=.6; master.connect(ctx.destination);
        buf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate); const d=buf.getChannelData(0); let b=0; for(let i=0;i<d.length;i++){ const w=Math.random()*2-1; b=b*.97+w*.03; d[i]=(w*.5+b*6)*.6; } }
      if(ctx.state==='suspended') ctx.resume(); start();
    },
    /** the sound of a fingertip on damp soil */
    tap(pan){ if(!ctx||off()) return; const t=ctx.currentTime; tone(t,150,80,.12,.1,pan); noise(t,.09,'bandpass',900,.8,.05,.005,pan); [.05,.11].forEach(d=>noise(t+d,.05,'bandpass',3200+Math.random()*1500,2,.012,.004,pan)); },
    /** one tiny foot on the soil, panned to where the mite is */
    creep(pan,amp){ if(!ctx||off()) return; const now=performance.now(); if(now-creepWin>1000){ creepWin=now; creeps=0; } if(creeps++>16) return;
      noise(ctx.currentTime,.03,'bandpass',4600+Math.random()*3200,3,.012*amp,.004,pan); },
    /** curled up: a small squeak and a rustle of legs */
    curl(pan){ if(!ctx||off()) return; const t=ctx.currentTime; tone(t,2100,1300,.09,.014,pan); noise(t,.18,'bandpass',5200,1.2,.02,.01,pan); },
    mute(){ if(rainG) rainG.gain.setTargetAtTime(off()?0:.022,ctx.currentTime,.2); },
  };
})();
setInterval(()=>SND.mute(),700);

function setP(e){const r=cv.getBoundingClientRect();P.x=(e.clientX-r.left)/r.width*WX;P.y=(e.clientY-r.top)/r.height*WY;P.on=true}
cv.addEventListener('pointermove',setP);
cv.addEventListener('pointerdown',e=>{setP(e);P.down=true;SND.unlock();SND.tap(P.x/WX*2-1);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
const up=()=>{P.down=false};
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',()=>{if(!P.down)P.on=false});

/* ---------- behaviour: arthropod locomotion ----------
   No inertia: a mite's speed and turning follow its legs. It walks in bursts, stops to feel with its front legs,
   pivots in place by stepping around, steers around its neighbours, and sprints away from a hovering finger. */
const FOOT=30;
function step(m,dt,now){
  const sec=dt/1000, age=now-m.t0, e=Math.min(1,age/1500);
  m.sc=(.25+.75*(1-Math.pow(1-e,3)))*(1-m.dive);
  const under=P.on&&H.press>.5&&Math.hypot(m.x-P.x,m.y-P.y)<FOOT;
  if(under) m.hold=500; else if(m.hold>0) m.hold-=dt;
  const tgt=(under||m.hold>0)?1:0;
  if(under&&!m.pressed){                                            // the instant a finger lands: a jolt, a shudder, a squash
    m.pressed=true; SND.curl(m.x/WX*2-1);
    const a=Math.atan2(m.y-P.y,m.x-P.x)+rnd(-.5,.5), kick=rnd(115,150);
    m.vx+=Math.cos(a)*kick; m.vy+=Math.sin(a)*kick;               // nudged away from the finger
    m.sV+=rnd(-1,1)<0?-9:9;                                         // rotational shudder
    m.sqV-=2.6;                                                      // body squashes smaller
  }
  if(!under&&m.hold<=0) m.pressed=false;
  m.curl+=(tgt-m.curl)*(tgt?.3:.05);
  if(m.curl<.01&&!tgt) m.curl=0;
  m.rock+=(0-m.rock)*.2;
  { const K=240, C=13;                                              // damped springs: offset, shudder angle, squash
    m.vx+=(-K*m.ox-C*m.vx)*sec; m.vy+=(-K*m.oy-C*m.vy)*sec; m.ox+=m.vx*sec; m.oy+=m.vy*sec;
    m.sV+=(-420*m.sA-9*m.sV)*sec; m.sA+=m.sV*sec;
    const sqT=-.13*m.curl; m.sqV+=(-300*(m.sq-sqT)-12*m.sqV)*sec; m.sq+=m.sqV*sec; }
  if(m.curl>.25){ m.speed*=.5; m.state='pause'; return; }          // frozen, curled up: thanatosis
  if(!m.leave&&age>m.life) m.leave=true;

  // how fast and which way does it want to go?
  let vmax=17*(RM?.5:1), turnMax=1.1, wantH=m.h;
  const dxp=m.x-P.x, dyp=m.y-P.y, dp=Math.hypot(dxp,dyp);
  const nearFinger=P.on&&H.a>.3&&dp<78&&!P.down&&Pv>40;      // only a finger that is moving fast scares them; a still one can pin a mite
  if(age<1500){ vmax=14; }                                         // climbing out of the burrow, straight ahead
  else if(nearFinger){                                             // a hovering finger: sprint away, legs flying
    m.state='flee'; m.flee=.8; wantH=Math.atan2(dyp,dxp); vmax=46; turnMax=6;
  } else if(m.flee>0){ m.flee-=sec; vmax=30; turnMax=3; if(m.flee<=0) m.state='pause', m.st=rnd(.5,1.1); }
  else if(m.leave){ wantH=Math.atan2(m.home.y-m.y,m.home.x-m.x); vmax=22; turnMax=2.2; if(Math.hypot(m.home.x-m.x,m.home.y-m.y)<12) m.dive+=dt/650; }
  else {
    // stop-and-go: walk, pause to feel about, then pivot onto a new heading
    m.st-=sec;
    if(m.state==='walk'&&m.st<=0){ m.state='pause'; m.st=rnd(.45,1.5); }
    else if(m.state==='pause'&&m.st<=0){ m.state='walk'; m.st=rnd(.9,2.6); m.goal=m.h+rnd(-1.3,1.3); }
    wantH=m.goal+Math.sin(now/1000*.9+m.probe)*.25;               // a lazy zig-zag as it goes
    for(const o of mites){ if(o===m||o.dive>0) continue;
      const dx=o.x-m.x, dy=o.y-m.y, d=Math.hypot(dx,dy);
      if(d<70){ const rel=wrap(Math.atan2(dy,dx)-m.h);
        if(Math.abs(rel)<1.1){ if(d<46){ m.state='pause'; m.st=Math.max(m.st,.35); } m.goal=m.h-Math.sign(rel||1)*1.2; } } }  // feel a neighbour ahead, stop, sidestep
    if(Math.hypot((m.x-WX/2)/(WX*.46),(m.y-WY/2)/(WY*.44))>1){ m.goal=Math.atan2(WY/2-m.y,WX/2-m.x); if(m.state==='pause') m.st=Math.min(m.st,.2); }
  }
  // turning is done by the legs: faster when walking slowly, never more than the gait allows
  const err=wrap(wantH-m.h), moving=(m.state==='walk'||m.state==='flee')||age<1500;
  const wantYaw=Math.max(-turnMax,Math.min(turnMax,err*(moving?3.2:5)));
  m.yaw+=(wantYaw-m.yaw)*Math.min(1,sec*14);
  if(m.state==='pause'&&Math.abs(err)<.08) m.yaw*=.7;
  m.h+=m.yaw*sec;
  // speed follows the legs within a few frames: no sliding, no momentum
  const vt=(moving&&Math.abs(err)<1.6)?vmax*(1-.45*Math.min(1,Math.abs(m.yaw)/3)):0;
  m.speed+=(vt-m.speed)*Math.min(1,sec*12);
  // each step shoves the body forward in a little pulse, and it rocks side to side with the alternating legs
  const pulse=1+.22*Math.sin(m.ph*4*Math.PI+.4);
  const v=m.speed*pulse*(RM?.6:1);
  m.x+=Math.cos(m.h)*v*sec; m.y+=Math.sin(m.h)*v*sec;
  // legs only cycle when they are carrying the body: forward walking or pivoting on the spot
  const legRate=(m.speed+Math.abs(m.yaw)*26*m.s*m.sc)/STRIDE;
  m.ph+=legRate*sec*(m.state==='pause'&&Math.abs(m.yaw)<.15?0:1);
  m.rock=Math.sin(m.ph*2*Math.PI)*.045*Math.min(1,m.speed/10)+m.yaw*.04;
}

/* ---------- loop ---------- */
const sh=mk(), sx=sh.getContext('2d');
const cnt=document.getElementById('count'); let last=performance.now(), Pv=0, lastPx=P.x, lastPy=P.y;
function frame(now){
  const dt=Math.min(40,now-last); last=now; now_t=now/1000;
  { const sp=Math.hypot(P.x-lastPx,P.y-lastPy)/Math.max(dt/1000,.001); Pv+=(sp-Pv)*.25; lastPx=P.x; lastPy=P.y; }
  if(now>nextSpawn && mites.length<9){ spawn(now); nextSpawn=now+(mites.length<4?900:rnd(2500,6000)); }
  H.x+=(P.x-H.x)*.35; H.y+=(P.y-H.y)*.35;
  H.a+=((P.on?1:0)-H.a)*.12;
  H.press+=((P.down?1:0)-H.press)*.28;
  mites.forEach(m=>{ step(m,dt,now); if(m.speed>2&&m.curl<.2&&m.sc>.6){ m.cr=(m.cr||0)+dt; const iv=Math.max(70,230-m.speed*7); if(m.cr>iv){ m.cr=0; SND.creep(m.x/WX*2-1,Math.min(1.4,.6+m.speed/20)); } } });
  for(let i=mites.length-1;i>=0;i--) if(mites[i].dive>=1) mites.splice(i,1);

  ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(bg,0,0);
  sx.setTransform(1,0,0,1,0,0); sx.clearRect(0,0,sh.width,sh.height); sx.setTransform(dpr,0,0,dpr,0,0);
  mites.forEach(m=>drawMite(sx,m,true));
  ctx.filter='blur('+(2.4*dpr)+'px)'; ctx.drawImage(sh,0,0); ctx.filter='none';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  mites.slice().sort((a,b)=>a.y-b.y).forEach(m=>drawMite(ctx,m,false));
  ctx.setTransform(1,0,0,1,0,0);
  ctx.setTransform(dpr,0,0,dpr,0,0);

  if(H.a>.02){
    ctx.save(); ctx.globalAlpha=H.a;
    if(H.press>.05){ // soil dents under the fingertip
      const gr=ctx.createRadialGradient(P.x,P.y,0,P.x,P.y,FOOT);
      gr.addColorStop(0,'rgba(0,0,0,'+(.3*H.press)+')'); gr.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(P.x,P.y,FOOT,0,7); ctx.fill();
      ctx.strokeStyle='rgba(255,235,215,'+(.35*H.press)+')'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(P.x,P.y,FOOT,0,7); ctx.stroke();
    }
    ctx.restore();
  }
  cnt.textContent=mites.length+(mites.length===1?' mite':' mites');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
