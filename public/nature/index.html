<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nature</title>
<style>
  :root { --ink: #2c2420; --ink-soft: #8a7f73; }
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none;
    font: 500 13px/1.3 -apple-system, "SF Pro Text", system-ui, sans-serif; color: var(--ink); }
  /* every scene dissolves softly into the page at its edges, like a memory */
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    -webkit-mask-image: radial-gradient(ellipse 58% 52% at 50% 44%, #000 36%, rgba(0,0,0,.55) 66%, transparent 100%);
            mask-image: radial-gradient(ellipse 58% 52% at 50% 44%, #000 36%, rgba(0,0,0,.55) 66%, transparent 100%); }
  .frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff;
    opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .55s ease, visibility 0s .55s; }
  body.is-mites #mites, body.is-grass #grass { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .55s ease, visibility 0s; }
  body.is-mites canvas, body.is-grass canvas { visibility: hidden; }
  body.is-mites .wind, body.is-grass .wind { display: none; }

  .bar { position: fixed; display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: 999px;
         background: rgba(12,24,10,.42); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); color: #eef6e4; letter-spacing: .02em; }
  .wind { top: max(16px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); padding: 10px 16px; gap: 14px; z-index: 5; transition: opacity .4s; }
  .embed .wind { top: 76px; }
  .wind output { min-width: 4.6em; text-align: right; font-variant-numeric: tabular-nums; opacity: .9; }
  #px { all: unset; cursor: pointer; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,.16); font-size: 12px; white-space: nowrap; }
  #px[aria-pressed="false"] { background: transparent; opacity: .75; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: min(30vw, 200px); height: 28px; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: rgba(255,255,255,.35); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -9px; border-radius: 50%; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.35); }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: rgba(255,255,255,.35); }
  input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border: 0; border-radius: 50%; background: #fff; }

  /* caption, hint and the scene strip under the picture */
  .deck { position: fixed; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom)); z-index: 5;
          display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 16px; pointer-events: none; }
  .caption { text-align: center; transition: opacity .35s; }
  .caption b { display: block; font: 600 15px/1.2 "Fraunces", Georgia, serif; color: var(--ink); }
  .caption span { color: var(--ink-soft); font-size: 12px; }
  .cap-hint { margin: 2px 0 6px; color: var(--ink-soft); font-size: 11px; text-align: center; max-width: 620px; transition: opacity .35s; }
  .deck.swap .caption, .deck.swap .cap-hint { opacity: 0; }
  .strip { position: static; pointer-events: auto; gap: 8px; padding: 8px 10px; background: rgba(255,255,255,.78); border: 1px solid rgba(44,36,32,.08);
           box-shadow: 0 6px 24px rgba(44,36,32,.12); color: var(--ink); }
  .thumb { all: unset; cursor: pointer; position: relative; width: 62px; height: 42px; border-radius: 8px; background: #ddd center/cover no-repeat;
           opacity: .7; transition: opacity .25s, transform .25s; }
  .thumb:hover { opacity: 1; }
  .thumb[aria-current="true"] { opacity: 1; box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--ink); }
  .thumb i { position: absolute; left: 3px; right: 3px; bottom: -9px; height: 2px; border-radius: 2px; background: rgba(44,36,32,.15); overflow: hidden; display: none; }
  .thumb[aria-current="true"] i { display: block; }
  .thumb i::after { content: ""; display: block; height: 100%; width: calc(var(--p, 0) * 100%); background: var(--ink); }
  #play { all: unset; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(44,36,32,.9); color: #fff; font-size: 11px; margin-left: 2px; }
  @media (max-width: 520px) { .thumb { width: 50px; height: 36px; } .cap-hint { font-size: 10.5px; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap">
</head>
<body>
<canvas id="c"></canvas>
<iframe class="frame" id="grass" title="Grass" data-src="/grass/?inner=1"></iframe>
<iframe class="frame" id="mites" title="Mite Burrow" data-src="./mites.html"></iframe>
<div class="bar wind"><button id="px" type="button" aria-pressed="true">Pixel: on</button><span>Wind</span><input id="wind" type="range" min="0" max="3" step="0.01" value="0.8" aria-label="Wind speed"><output id="label">Breeze</output></div>
<div class="deck" id="deck">
  <div class="caption"><b id="cap-title"></b><span id="cap-sub"></span></div>
  <p class="cap-hint" id="cap-hint"></p>
  <nav class="bar strip" id="scenes" aria-label="Scenes"></nav>
</div>
<script>if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");</script>
<script type="module" src="./nature.js"></script>
</body>
</html>
