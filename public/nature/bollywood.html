<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bollywood</title>
<style>
  :root { --paper: #f5f3ef; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  /* one fixed 1400 x 1000 world, scaled to fit, every layer placed in percentages of it */
  .world { position: absolute; left: 50%; top: 50%; width: min(100vw, 140vh); aspect-ratio: 1400 / 1000; transform: translate(-50%, -50%); }
  .world > * { position: absolute; display: block; pointer-events: none; }
  .glow { inset: -10% -6%; background: radial-gradient(48% 52% at 50% 46%, rgba(255, 214, 170, .55), rgba(255, 226, 196, .22) 55%, transparent 78%); }
  .taj   { left: 10.714%; top: 22%;   width: 78.571%; }
  .frame { left: 14.286%; top: 4.2%;  width: 71.429%; }
  .lady  { left: 41.4%;   top: 62.2%; width: 17.3%; }   /* placed from SCALE in the script */
  .taj, .frame { filter: brightness(1.07) contrast(.97) saturate(.96); }   /* a touch lighter */
  .taj { opacity: .8; }                                                      /* a little cloudy, the haze of the paper shows through */
  .man { transition: opacity .5s ease; }
  .man   { left: 24.64%;  top: 60.5%; width: 7.93%; }   /* the photographer, on the left of the platform */
  .world > canvas { inset: 0; width: 100%; height: 100%; pointer-events: auto; cursor: pointer; touch-action: none; }
</style>
</head>
<body>
<div class="world" id="world">
  <div class="glow"></div>
  <img class="taj"   src="./bollywood/taj.webp"   alt="The Taj Mahal" draggable="false">
  <img class="frame" src="./bollywood/frame.webp" alt="" draggable="false">
  <img class="man"   src="./bollywood/photographer.webp" alt="A photographer in a cream shirt and backpack, raising a camera toward the Taj Mahal" draggable="false">
  <img class="lady"  src="./bollywood/lady.webp"  alt="A woman in a cream and green lehenga, arms open, seen from behind" draggable="false">
  <canvas id="c" aria-label="Her dupatta flows in the wind. Move the pointer to stir the air, tap for a gust."></canvas>
</div>

<script type="module">
import * as THREE from "./vendor/three.module.min.js";
THREE.ColorManagement.enabled = false;

const WORLD_W = 1400, WORLD_H = 1000;
/* how big she is, as a fraction of the original (1 = filling the arch). Everything about her
   (her place on the platform, the dupatta, and its physics) is derived from this one number. */
const SCALE = 0.34;
const LADY_W = 714 * SCALE, LADY_H = 700 * SCALE;
const LADY_LEFT = 770 - LADY_W / 2, LADY_TOP = 614;      // head top sits on y=616 (the line the user marked)
{ const el = document.querySelector(".lady"); el.style.left = (LADY_LEFT / WORLD_W * 100) + "%"; el.style.top = (LADY_TOP / WORLD_H * 100) + "%"; el.style.width = (LADY_W / WORLD_W * 100) + "%"; }
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- renderer: an orthographic view that matches the 1400 x 1000 world ---------- */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(0, WORLD_W, WORLD_H, 0, -3000, 3000);
camera.position.z = 1000;
const fit = () => { const r = canvas.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); };
new ResizeObserver(fit).observe(canvas); fit();


/* ---------- the dupatta: a gathered silk rectangle ---------- */
const COLS = 30, ROWS = 140;      // a fine weave of simulated points, so even small folds and creases hold their shape
const LENGTH = 600, W_TOP = 28, W_FULL = 150;   // a big dupatta, in world pixels
const ANCHOR = { x: LADY_LEFT + 85 * 0.7 * SCALE, y: LADY_TOP + 275.7 * 0.7 * SCALE }; // her left hand (on the left of the picture), in world pixels (y down)
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const widthAt = (v) => W_TOP + (W_FULL - W_TOP) * smooth(0, 0.2, v);
const N = COLS * ROWS, idx = (i, j) => j * COLS + i;
const px = new Float32Array(N * 3), pv = new Float32Array(N * 3);   // position, previous position
const pinned = new Uint8Array(N);
const rest = [];                                                     // [a, b, restLength, stiffness]
for (let j = 0; j < ROWS; j++) {
  const v = j / (ROWS - 1), w = widthAt(v);
  for (let i = 0; i < COLS; i++) {
    const u = i / (COLS - 1), k = idx(i, j) * 3;
    px[k] = ANCHOR.x - v * LENGTH;
    px[k + 1] = ANCHOR.y + (u - 0.5) * w;
    px[k + 2] = ((Math.random() - 0.5) * 6 + Math.sin(u * 6.28) * 4) * SCALE;
    pv[k] = px[k]; pv[k + 1] = px[k + 1]; pv[k + 2] = px[k + 2];
    if (j === 0) pinned[idx(i, j)] = 1;
  }
}
const dist = (a, b) => Math.hypot(px[a * 3] - px[b * 3], px[a * 3 + 1] - px[b * 3 + 1], px[a * 3 + 2] - px[b * 3 + 2]);
const link = (a, b, s) => rest.push([a, b, dist(a, b), s]);
for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
  const a = idx(i, j);
  if (i + 1 < COLS) link(a, idx(i + 1, j), 1);                         // across
  if (j + 1 < ROWS) link(a, idx(i, j + 1), 1);                         // along
  if (i + 1 < COLS && j + 1 < ROWS) { link(a, idx(i + 1, j + 1), 0.6); link(idx(i + 1, j), idx(i, j + 1), 0.6); } // shear
  if (i + 2 < COLS) link(a, idx(i + 2, j), 0.25);                      // bend
  if (j + 2 < ROWS) link(a, idx(i, j + 2), 0.25);
}
// keep the gathered edge from collapsing: the pinned row holds its spacing
const pinRest = [];
for (let i = 0; i < COLS; i++) pinRest.push({ i, dy: (i / (COLS - 1) - 0.5) * W_TOP });

/* ---------- the photographer's silhouette, and where the dupatta lies when it wraps him ----------
   BODY holds one row per few pixels of him: [y, centre x, half width], measured from his cut-out.
   Click the scene and the dupatta flies from her hand, loops over his head and settles over that outline. */
const BODY = [[607,392.2,10.9],[613,391.8,13.9],[619,392.3,17.1],[625,394.2,21.5],[631,396.5,23.7],[637,397.3,24.8],[643,397.3,27.6],[649,396.5,30.9],[655,394.7,33.7],[661,393.1,37.4],[667,393.2,41.2],[673,394.1,43.2],[679,394.3,44],[685,392.6,41.9],[691,390.4,39.7],[697,387.9,37.9],[703,385.8,36.1],[709,385,34.4],[715,385.8,35],[721,387,35.3],[727,388.2,34.8],[733,389.3,33.8],[739,390.3,32.9],[745,391.2,31.8],[751,391.8,30.8],[757,392.8,30.6],[763,393.5,30.9],[769,393.7,31.7],[775,393.9,32.3],[781,393.9,32.6],[787,393.8,32.3],[793,393.7,31.8],[799,393.9,31.4],[805,394,31.1],[811,394.2,31.7],[817,394.5,31.7],[823,395.1,32.4],[829,395.5,33.1],[835,396,33.8],[841,396.8,34.4],[847,397.6,35.5],[853,399.8,36.9],[859,402.2,38.8],[865,404.2,40.7],[871,403.8,39.6],[877,403,37.9],[883,400.8,35.8]];
const bodyAt = (y) => {
  const f = (Math.min(Math.max(y, BODY[0][0]), BODY[BODY.length - 1][0]) - BODY[0][0]) / 6, i = Math.min(BODY.length - 2, Math.floor(f)), t = f - i;
  return [BODY[i][1] + (BODY[i + 1][1] - BODY[i][1]) * t, BODY[i][2] + (BODY[i + 1][2] - BODY[i][2]) * t];
};
const SKIN = 2.5, DEPTH = 0.62;                                            // his rounded body: as deep as 0.62 of his width, plus the silk's own thickness
const HEAD_Y = BODY[0][0] - 6, FEET_Y = BODY[BODY.length - 1][0] + 4;
// his outline at height y as an ellipse [centre x, half width, half depth]; over his head it tents out toward the shoulders
const tentAt = (y) => { const [bx, hw0] = bodyAt(y), e = smooth(HEAD_Y + 20, HEAD_Y + 60, y), hw = Math.max(hw0, 26 * (1 - e) + hw0 * e); return [bx, hw + SKIN, hw * DEPTH + SKIN]; };
const tgt = new Float32Array(N * 3);
{
  /* where it lands, like a top drawn onto a dress form: the free end lies down his back from the shoulder blades, the silk
     goes up over his crown like a hood, then falls down his front, every thread wrapped round his rounded outline
     (an elliptical slice of him at each height). What is left over pools in soft folds at his feet. */
  const BACK = 78, S1 = BACK + 16, bodyLen = Math.min(LENGTH - S1, FEET_Y - HEAD_Y + 20);
  const slack = Math.max(0, (LENGTH - S1) - bodyLen);
  const M = 96, SPAN = Math.PI * 0.94;
  for (let j = 0; j < ROWS; j++) {
    const s = j / (ROWS - 1) * LENGTH;
    let y, phi;
    if (s <= S1) { const f = s / S1; y = HEAD_Y + BACK * Math.pow(1 - f, 1.4); phi = Math.PI * (1 - smooth(0.62, 1, f)); }   // up his back, over the crown
    else { const d = Math.min(s - S1, bodyLen); y = HEAD_Y + d * ((FEET_Y - HEAD_Y) / bodyLen) + Math.max(0, s - S1 - bodyLen) * 0.12; phi = 0; }
    const [bx, A, B] = tentAt(y), gather = 0.9 + 0.06 * Math.sin(j * 0.21);
    const L = [0]; for (let q = 1; q <= M; q++) { const th = q / M * SPAN; L.push(L[q - 1] + Math.hypot(A * Math.cos(th), B * Math.sin(th)) * SPAN / M); }
    for (let i = 0; i < COLS; i++) {
      const u = i / (COLS - 1) - 0.5, want = Math.abs(u) * W_FULL * gather, k = idx(i, j) * 3;
      let q = 0; while (q < M - 1 && L[q + 1] < want) q++;
      const th = phi + Math.sign(u) * Math.min(SPAN, (q + (want - L[q]) / ((L[q + 1] - L[q]) || 1)) / M * SPAN);
      tgt[k] = bx + A * Math.sin(th);
      tgt[k + 1] = y + Math.sin(u * 9 + j * 0.3) * 1.2 - (s <= S1 ? 3 * Math.cos(th) : 0);
      tgt[k + 2] = B * Math.cos(th) + (s > S1 + bodyLen ? Math.sin(u * 22 + j * 0.45) * (2 + slack * 0.02) : 0);
    }
  }
}
let wrap = 0, wrapOn = false, flip = false, settle = 0;                                              // wrap: 0 free in the wind, 1 lying over him
/* The dupatta's life, like the film shot: it streams from her hand, then a gust tears it loose, it tumbles through the air
   as a floppy white streamer, is carried to him, opens up like a sail and drapes over his head. Click again and the wind
   peels it off and brings it home to her hand.
   held -> flying -> wrapped -> returning -> held */
let mode = "held", flyT = 0;
const hand = () => ({ x: ANCHOR.x, y: ANCHOR.y });
const centre = { x: ANCHOR.x, y: ANCHOR.y, vx: 0, vy: 0 };
function updateCentre() { let sx = 0, sy = 0; for (let p = 0; p < N; p++) { sx += px[p * 3]; sy += px[p * 3 + 1]; } const nx = sx / N, ny = sy / N; centre.vx = (nx - centre.x) / STEP * 0.35 + centre.vx * 0.65; centre.vy = (ny - centre.y) / STEP * 0.35 + centre.vy * 0.65; centre.x = nx; centre.y = ny; }
function release() {
  mode = "flying"; flyT = 0;
  for (let i = 0; i < COLS; i++) pinned[idx(i, 0)] = 0;
  for (let p = 0; p < N; p++) { const k = p * 3, j = Math.floor(p / COLS) / (ROWS - 1); pv[k] -= (-170 - 120 * j) * STEP; pv[k + 1] -= (-300 + 150 * j) * STEP; }   // the toss: up and away from her hand
}
const manEl = document.querySelector(".man");

/* mesh, textured with the dupatta pattern from the reference */
const geo = new THREE.BufferGeometry();
const pos = new Float32Array(N * 3), uv = new Float32Array(N * 2), ind = [];
for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) { const k = idx(i, j) * 2; uv[k] = i / (COLS - 1); uv[k + 1] = 1 - j / (ROWS - 1); }
for (let j = 0; j < ROWS - 1; j++) for (let i = 0; i < COLS - 1; i++) {
  const a = idx(i, j), b = idx(i + 1, j), c = idx(i, j + 1), d = idx(i + 1, j + 1);
  ind.push(a, c, b, b, c, d);
}
geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
geo.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
const fold = new Float32Array(N * 2); geo.setAttribute("aFold", new THREE.BufferAttribute(fold, 2));
geo.setIndex(ind);
const tex = new THREE.TextureLoader().load("./bollywood/dupatta.webp");
tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
// silk: the pattern in its own colours, softly lit from the upper left, with a faint sheen where it turns edge-on
const mat = new THREE.ShaderMaterial({
  uniforms: { map: { value: tex }, alpha: { value: 1 }, time: { value: 0 }, wrap: { value: 0 } },
  transparent: true,
  side: THREE.DoubleSide,
  extensions: { derivatives: true },
  vertexShader: `attribute vec2 aFold; varying vec2 vUv; varying vec3 vN; varying vec3 vP; varying vec2 vF;
    void main(){ vUv = uv; vN = normal; vF = aFold; vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform sampler2D map; uniform float alpha; uniform float wrap; varying vec2 vUv; varying vec3 vN; varying vec3 vP; varying vec2 vF;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f); return mix(mix(h(i), h(i + vec2(1, 0)), f.x), mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), f.x), f.y); }
    void main(){
      vec3 dp1 = dFdx(vP), dp2 = dFdy(vP); vec2 du1 = dFdx(vUv), du2 = dFdy(vUv);
      vec3 T = normalize(dp1 * du2.y - dp2 * du1.y + 1e-6);                  // along the warp threads
      vec3 n = normalize(vN); if (!gl_FrontFacing) n = -n;
      // fine crumples where the cloth is squeezed: small wobbling normals scaled by compression
      float sq = clamp(-vF.y, 0.0, 1.0) + 0.25 * vF.x;
      vec2 q = vUv * vec2(60.0, 170.0);
      n = normalize(n + (vec3(vn(q) - 0.5, vn(q + 7.3) - 0.5, vn(q * 1.7 + 3.1) - 0.5)) * (0.20 + 1.4 * sq));
      vec3 L = normalize(vec3(-0.45, 0.55, 0.7)), V = vec3(0.0, 0.0, 1.0), H = normalize(L + V);
      float diff = max(dot(n, L), 0.0);
      float back = pow(clamp(dot(-n, L), 0.0, 1.0), 1.4);                    // light shining through the silk
      float ts = dot(T, H), aniso = pow(sqrt(max(0.0, 1.0 - ts * ts)), 36.0) * smoothstep(0.0, 0.4, diff + 0.1);
      float rim = pow(1.0 - abs(n.z), 2.6);
      vec3 base = texture2D(map, vUv).rgb;
      float wp = 0.5 + 0.5 * sin(vUv.x * 520.0) * sin(vUv.y * 1500.0);        // the weave, faint, fading as it gets too fine
      float wv = mix(1.0, 0.94 + 0.10 * wp, 0.85);
      float ao = 1.0 - 0.30 * vF.x;                                           // the deep of a fold is darker
      vec3 col = base * wv * ao * (0.78 + 0.34 * diff - 0.08 * (1.0 - abs(n.z)));
      col *= 1.0 - 0.30 * wrap * pow(1.0 - abs(n.z), 1.6);                    // on him: it turns away into shade at his sides, so his roundness reads
      col += base * vec3(1.0, 0.9, 0.72) * back * 0.30;                       // warm glow through thin layers
      col += vec3(1.0, 0.95, 0.84) * (aniso * 0.20 + rim * 0.10);             // silk sheen
      gl_FragColor = vec4(col, alpha);
    }`,
});
const shadows = [[10, -14, 0.10], [20, -26, 0.08], [32, -40, 0.06]].map(([dx, dy, o]) => {
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x4a3a30, transparent: true, opacity: o, depthWrite: false, side: THREE.DoubleSide }));
  m.position.set(dx, dy, -2); m.frustumCulled = false; m.renderOrder = -1; scene.add(m); return m;
});
const cloth = new THREE.Mesh(geo, mat); cloth.frustumCulled = false; scene.add(cloth);

/* ---------- wind ---------- */
let windSlider = 0.8;                    // from the page's wind slider (0 to 3), default breeze
addEventListener("message", (e) => { if (e.data && typeof e.data.wind === "number") windSlider = e.data.wind; });
let gust = 0, kick = 0, ptr = null, ptrVel = { x: 0, y: 0 };
const noise = (t, s) => Math.sin(t * 0.9 + s) * 0.5 + Math.sin(t * 1.7 + s * 2.3) * 0.3 + Math.sin(t * 3.1 + s * 0.7) * 0.2;
function worldPoint(ev) { const r = canvas.getBoundingClientRect(); return { x: (ev.clientX - r.left) / r.width * WORLD_W, y: (ev.clientY - r.top) / r.height * WORLD_H }; }
canvas.addEventListener("pointermove", (ev) => {
  const p = worldPoint(ev);
  if (ptr) { ptrVel.x = p.x - ptr.x; ptrVel.y = p.y - ptr.y; }
  ptr = p;
  gust = Math.min(1.6, gust + Math.hypot(ptrVel.x, ptrVel.y) * 0.004);
});
canvas.addEventListener("pointerleave", () => { ptr = null; ptrVel = { x: 0, y: 0 }; });
canvas.addEventListener("pointerdown", () => {
  if (mode === "held") release();
  else if (mode === "wrapped") { mode = "returning"; wrapOn = false; kick = 1.8; }       // the wind peels it off him and sends it home
  else gust = Math.min(1.6, gust + 0.8);                                                  // mid-flight: just a puff to stir it
});

/* ---------- physics (fixed step, sub-stepped, then relaxed for silk smoothness) ---------- */
const STEP = 1 / 60, SUB = 3, DT = STEP / SUB, ITER = 9;
const WS = 0.5, GRAVITY = 820 * SCALE, DRAG = 0.994, AIR = 0.012, AIRDRAG = 1.5;
const nrm = new Float32Array(N * 3);
function normals() {
  nrm.fill(0);
  for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
    const a = idx(i, j) * 3, r = idx(Math.min(i + 1, COLS - 1), j) * 3, l = idx(Math.max(i - 1, 0), j) * 3,
          d = idx(i, Math.min(j + 1, ROWS - 1)) * 3, u = idx(i, Math.max(j - 1, 0)) * 3;
    const ax = px[r] - px[l], ay = px[r + 1] - px[l + 1], az = px[r + 2] - px[l + 2];
    const bx = px[d] - px[u], by = px[d + 1] - px[u + 1], bz = px[d + 2] - px[u + 2];
    let nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
    const m = Math.hypot(nx, ny, nz) || 1; nrm[a] = nx / m; nrm[a + 1] = ny / m; nrm[a + 2] = nz / m;
  }
}
/* self-collision: points of one layer of silk push away from points of another, so folds stack instead of passing through */
const CELL = 9, THICK = 6.5, HASH = new Map();
function selfCollide() {
  HASH.clear();
  for (let p = 0; p < N; p++) {
    const key = (Math.floor(px[p * 3] / CELL) * 73856093) ^ (Math.floor(px[p * 3 + 1] / CELL) * 19349663) ^ (Math.floor(px[p * 3 + 2] / CELL) * 83492791);
    const a = HASH.get(key); if (a) a.push(p); else HASH.set(key, [p]);
  }
  for (let p = 0; p < N; p++) {
    const x = px[p * 3], y = px[p * 3 + 1], z = px[p * 3 + 2], ci = p % COLS, cj = (p / COLS) | 0;
    const cx = Math.floor(x / CELL), cy = Math.floor(y / CELL), cz = Math.floor(z / CELL);
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) {
      const lst = HASH.get(((cx + dx) * 73856093) ^ ((cy + dy) * 19349663) ^ ((cz + dz) * 83492791)); if (!lst) continue;
      for (const q of lst) {
        if (q <= p) continue;
        const qi = q % COLS, qj = (q / COLS) | 0;
        if (Math.abs(qi - ci) <= 3 && Math.abs(qj - cj) <= 3) continue;                          // neighbours on the same sheet are the springs' job
        const ex = px[q * 3] - x, ey = px[q * 3 + 1] - y, ez = px[q * 3 + 2] - z, d2 = ex * ex + ey * ey + ez * ez;
        if (d2 >= THICK * THICK || d2 < 1e-6) continue;
        const d = Math.sqrt(d2), f = (THICK - d) / d * 0.5;
        if (!pinned[p]) { px[p * 3] -= ex * f; px[p * 3 + 1] -= ey * f; px[p * 3 + 2] -= ez * f; }
        if (!pinned[q]) { px[q * 3] += ex * f; px[q * 3 + 1] += ey * f; px[q * 3 + 2] += ez * f; }
      }
    }
  }
}
/* his body as a soft solid: elliptical slices from his outline. Silk that would pass into him is laid back on his surface and
   keeps only the part of its motion that slides along him, so it glides round his shoulders instead of snapping through. */
const SLICE = BODY.map(([y, bx, hw]) => [bx, hw + SKIN, hw * DEPTH + SKIN]);
function bodyCollide(str) {
  for (let p = 0; p < N; p++) {
    if (pinned[p]) continue;
    const k = p * 3, y = px[k + 1]; if (y < BODY[0][0] || y > FEET_Y) continue;
    const f = (y - BODY[0][0]) / 6, i = Math.min(BODY.length - 2, f | 0), t = f - i, A = SLICE[i], B = SLICE[i + 1];
    const bx = A[0] + (B[0] - A[0]) * t, a = A[1] + (B[1] - A[1]) * t, b = A[2] + (B[2] - A[2]) * t;
    const ex = (px[k] - bx) / a, ez = px[k + 2] / b, r = Math.hypot(ex, ez);
    if (r >= 1 || r < 1e-4) continue;
    const m = 1 + (1 / r - 1) * str;
