<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bollywood</title>
<style>
  :root { --paper: #f5f3ef; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  /* one fixed 1400 x 1000 world, scaled to fit, every layer placed in percentages of it */
  .world { position: absolute; left: 50%; top: 50%; width: min(100vw, 140vh); aspect-ratio: 1400 / 1000; transform: translate(-50%, -50%); }
  .world > * { position: absolute; display: block; pointer-events: none; }
  .glow { inset: -10% -6%; background: radial-gradient(48% 52% at 50% 46%, rgba(255, 214, 170, .55), rgba(255, 226, 196, .22) 55%, transparent 78%); }
  .taj   { left: 10.714%; top: 22%;   width: 78.571%; }
  .frame { left: 14.286%; top: 4.2%;  width: 71.429%; }
  .lady  { left: 41.4%;   top: 62.2%; width: 17.3%; }   /* placed from SCALE in the script */
  .man   { left: 24.64%;  top: 60.5%; width: 7.93%; }   /* the photographer, on the left of the platform */
  canvas { inset: 0; width: 100%; height: 100%; pointer-events: auto; touch-action: none; }
</style>
</head>
<body>
<div class="world" id="world">
  <div class="glow"></div>
  <img class="taj"   src="./bollywood/taj.webp"   alt="The Taj Mahal" draggable="false">
  <img class="frame" src="./bollywood/frame.webp" alt="" draggable="false">
  <img class="man"   src="./bollywood/photographer.webp" alt="A photographer in a cream shirt and backpack, raising a camera toward the Taj Mahal" draggable="false">
  <img class="lady"  src="./bollywood/lady.webp"  alt="A woman in a cream and green lehenga, arms open, seen from behind" draggable="false">
  <canvas id="c" aria-label="Her dupatta flows in the wind. Move the pointer to stir the air, tap for a gust."></canvas>
</div>

<script type="module">
import * as THREE from "./vendor/three.module.min.js";
THREE.ColorManagement.enabled = false;

const WORLD_W = 1400, WORLD_H = 1000;
/* how big she is, as a fraction of the original (1 = filling the arch). Everything about her
   (her place on the platform, the dupatta, and its physics) is derived from this one number. */
const SCALE = 0.34;
const LADY_W = 714 * SCALE, LADY_H = 700 * SCALE;
const LADY_LEFT = 770 - LADY_W / 2, LADY_TOP = 614;      // head top sits on y=616 (the line the user marked)
{ const el = document.querySelector(".lady"); el.style.left = (LADY_LEFT / WORLD_W * 100) + "%"; el.style.top = (LADY_TOP / WORLD_H * 100) + "%"; el.style.width = (LADY_W / WORLD_W * 100) + "%"; }
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- renderer: an orthographic view that matches the 1400 x 1000 world ---------- */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(0, WORLD_W, WORLD_H, 0, -3000, 3000);
camera.position.z = 1000;
const fit = () => { const r = canvas.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); };
new ResizeObserver(fit).observe(canvas); fit();


/* ---------- the dupatta: a gathered silk rectangle ---------- */
const COLS = 17, ROWS = 64;       // fine grid so folds stay silky
const LENGTH = 600 * SCALE, W_TOP = 40 * SCALE, W_FULL = 205 * SCALE;
const ANCHOR = { x: LADY_LEFT + 85 * 0.7 * SCALE, y: LADY_TOP + 275.7 * 0.7 * SCALE }; // her left hand (on the left of the picture), in world pixels (y down)
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const widthAt = (v) => W_TOP + (W_FULL - W_TOP) * smooth(0, 0.2, v);
const N = COLS * ROWS, idx = (i, j) => j * COLS + i;
const px = new Float32Array(N * 3), pv = new Float32Array(N * 3);   // position, previous position
const pinned = new Uint8Array(N);
const rest = [];                                                     // [a, b, restLength, stiffness]
for (let j = 0; j < ROWS; j++) {
  const v = j / (ROWS - 1), w = widthAt(v);
  for (let i = 0; i < COLS; i++) {
    const u = i / (COLS - 1), k = idx(i, j) * 3;
    px[k] = ANCHOR.x - v * LENGTH * 0.9;
    px[k + 1] = ANCHOR.y + (u - 0.5) * w;
    px[k + 2] = ((Math.random() - 0.5) * 6 + Math.sin(u * 6.28) * 4) * SCALE;
    pv[k] = px[k]; pv[k + 1] = px[k + 1]; pv[k + 2] = px[k + 2];
    if (j === 0) pinned[idx(i, j)] = 1;
  }
}
const dist = (a, b) => Math.hypot(px[a * 3] - px[b * 3], px[a * 3 + 1] - px[b * 3 + 1], px[a * 3 + 2] - px[b * 3 + 2]);
const link = (a, b, s) => rest.push([a, b, dist(a, b), s]);
for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
  const a = idx(i, j);
  if (i + 1 < COLS) link(a, idx(i + 1, j), 1);                         // across
  if (j + 1 < ROWS) link(a, idx(i, j + 1), 1);                         // along
  if (i + 1 < COLS && j + 1 < ROWS) { link(a, idx(i + 1, j + 1), 0.6); link(idx(i + 1, j), idx(i, j + 1), 0.6); } // shear
  if (i + 2 < COLS) link(a, idx(i + 2, j), 0.25);                      // bend
  if (j + 2 < ROWS) link(a, idx(i, j + 2), 0.25);
}
// keep the gathered edge from collapsing: the pinned row holds its spacing
const pinRest = [];
for (let i = 0; i < COLS; i++) pinRest.push({ i, dy: (i / (COLS - 1) - 0.5) * W_TOP });

/* mesh, textured with the dupatta pattern from the reference */
const geo = new THREE.BufferGeometry();
const pos = new Float32Array(N * 3), uv = new Float32Array(N * 2), ind = [];
for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) { const k = idx(i, j) * 2; uv[k] = i / (COLS - 1); uv[k + 1] = 1 - j / (ROWS - 1); }
for (let j = 0; j < ROWS - 1; j++) for (let i = 0; i < COLS - 1; i++) {
  const a = idx(i, j), b = idx(i + 1, j), c = idx(i, j + 1), d = idx(i + 1, j + 1);
  ind.push(a, c, b, b, c, d);
}
geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
geo.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
geo.setIndex(ind);
const tex = new THREE.TextureLoader().load("./bollywood/dupatta.webp");
tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
// silk: the pattern in its own colours, softly lit from the upper left, with a faint sheen where it turns edge-on
const mat = new THREE.ShaderMaterial({
  uniforms: { map: { value: tex } },
  side: THREE.DoubleSide,
  vertexShader: `varying vec2 vUv; varying vec3 vN;
    void main(){ vUv = uv; vN = normal; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform sampler2D map; varying vec2 vUv; varying vec3 vN;
    void main(){
      vec3 n = normalize(vN); if (!gl_FrontFacing) n = -n;
      vec3 l = normalize(vec3(-0.45, 0.55, 0.7));
      float d = max(dot(n, l), 0.0);
      float sheen = pow(1.0 - abs(n.z), 2.5);
      vec3 c = texture2D(map, vUv).rgb;
      float shade = 0.80 + 0.30 * d - 0.10 * (1.0 - abs(n.z));
      gl_FragColor = vec4(c * shade + vec3(1.0, 0.93, 0.8) * sheen * 0.10, 1.0);
    }`,
});
const cloth = new THREE.Mesh(geo, mat); cloth.frustumCulled = false; scene.add(cloth);

/* ---------- wind ---------- */
let windSlider = 0.8;                    // from the page's wind slider (0 to 3), default breeze
addEventListener("message", (e) => { if (e.data && typeof e.data.wind === "number") windSlider = e.data.wind; });
let gust = 0, kick = 0, ptr = null, ptrVel = { x: 0, y: 0 };
const noise = (t, s) => Math.sin(t * 0.9 + s) * 0.5 + Math.sin(t * 1.7 + s * 2.3) * 0.3 + Math.sin(t * 3.1 + s * 0.7) * 0.2;
function worldPoint(ev) { const r = canvas.getBoundingClientRect(); return { x: (ev.clientX - r.left) / r.width * WORLD_W, y: (ev.clientY - r.top) / r.height * WORLD_H }; }
canvas.addEventListener("pointermove", (ev) => {
  const p = worldPoint(ev);
  if (ptr) { ptrVel.x = p.x - ptr.x; ptrVel.y = p.y - ptr.y; }
  ptr = p;
  gust = Math.min(1.6, gust + Math.hypot(ptrVel.x, ptrVel.y) * 0.004);
});
canvas.addEventListener("pointerleave", () => { ptr = null; ptrVel = { x: 0, y: 0 }; });
canvas.addEventListener("pointerdown", () => { kick = 1; });

/* ---------- physics (fixed step, sub-stepped, then relaxed for silk smoothness) ---------- */
const STEP = 1 / 60, SUB = 3, DT = STEP / SUB, ITER = 6;
const GRAVITY = 820 * SCALE, DRAG = 0.994, AIR = 0.012, AIRDRAG = 1.5;
const nrm = new Float32Array(N * 3);
function normals() {
  nrm.fill(0);
  for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
    const a = idx(i, j) * 3, r = idx(Math.min(i + 1, COLS - 1), j) * 3, l = idx(Math.max(i - 1, 0), j) * 3,
          d = idx(i, Math.min(j + 1, ROWS - 1)) * 3, u = idx(i, Math.max(j - 1, 0)) * 3;
    const ax = px[r] - px[l], ay = px[r + 1] - px[l + 1], az = px[r + 2] - px[l + 2];
    const bx = px[d] - px[u], by = px[d + 1] - px[u + 1], bz = px[d + 2] - px[u + 2];
    let nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
    const m = Math.hypot(nx, ny, nz) || 1; nrm[a] = nx / m; nrm[a + 1] = ny / m; nrm[a + 2] = nz / m;
  }
}
let time = 0;
function simulate(t) {
  const strength = Math.max(0, windSlider) * (reduce ? 0.5 : 1);
  // the breath of the wind: slow swell, quick flutter, and a gust that fades away
  const swell = 0.6 + 0.4 * noise(t * 0.55, 1.3);
  const flutter = noise(t * 2.2, 4.1);
  gust *= 0.985; kick *= 0.96;
  const base = strength * (0.9 + 1.5 * swell) + gust * 1.8 + kick * 2.4;
  const wx = -540 * SCALE * base, wy = -150 * SCALE * base * (0.8 + 0.6 * flutter), wz = 300 * SCALE * base * noise(t * 0.8, 7.7);
  // her hand: a gentle sway that lifts a little with each gust
  const ax = ANCHOR.x + Math.sin(t * 0.7) * 4 * SCALE, ay = ANCHOR.y + Math.sin(t * 0.93) * 6 * SCALE - Math.min(14, base * 5) * SCALE;
  for (let s = 0; s < SUB; s++) {
    normals();
    for (let p = 0; p < N; p++) {
      if (pinned[p]) continue;
      const k = p * 3;
      let vx = (px[k] - pv[k]) / DT, vy = (px[k + 1] - pv[k + 1]) / DT, vz = (px[k + 2] - pv[k + 2]) / DT;
      // aerodynamic push: the part of the relative wind that strikes the surface
      const rx = wx * (1 + 0.35 * noise(t * 1.4, p * 0.013)) - vx, ry = wy - vy, rz = wz - vz;
      const dn = rx * nrm[k] + ry * nrm[k + 1] + rz * nrm[k + 2];
      // light silk is carried by the air itself (drag toward the wind) and billows where the wind meets its face
      let fx = rx * AIRDRAG + nrm[k] * dn * AIR * 60, fy = ry * AIRDRAG + nrm[k + 1] * dn * AIR * 60 + GRAVITY, fz = rz * AIRDRAG * 0.6 + nrm[k + 2] * dn * AIR * 60;
      // the pointer stirs the air nearby
      if (ptr) { const dx = px[k] - ptr.x, dy = px[k + 1] - ptr.y, d2 = dx * dx + dy * dy; if (d2 < 14000 * SCALE) { const f = (1 - d2 / (14000 * SCALE)) * 5200 * SCALE; const d = Math.sqrt(d2) || 1; fx += dx / d * f + ptrVel.x * 30 * SCALE; fy += dy / d * f + ptrVel.y * 30 * SCALE; fz += f * 0.35; } }
      const nx = px[k] + (px[k] - pv[k]) * DRAG + fx * DT * DT;
      const ny = px[k + 1] + (px[k + 1] - pv[k + 1]) * DRAG + fy * DT * DT;
      const nz = px[k + 2] + (px[k + 2] - pv[k + 2]) * DRAG + fz * DT * DT;
      pv[k] = px[k]; pv[k + 1] = px[k + 1]; pv[k + 2] = px[k + 2];
      px[k] = nx; px[k + 1] = ny; px[k + 2] = Math.max(-420 * SCALE, Math.min(420 * SCALE, nz));
    }
    for (const { i, dy } of pinRest) { const k = idx(i, 0) * 3; px[k] = ax; px[k + 1] = ay + dy; px[k + 2] = Math.sin(i * 0.9) * 3 * SCALE; pv[k] = px[k]; pv[k + 1] = px[k + 1]; pv[k + 2] = px[k + 2]; }
    for (let it = 0; it < ITER; it++) {
      for (let c = 0; c < rest.length; c++) {
        const [a, b, len, sf] = rest[c], ka = a * 3, kb = b * 3;
        const dx = px[kb] - px[ka], dy = px[kb + 1] - px[ka + 1], dz = px[kb + 2] - px[ka + 2];
        const d = Math.hypot(dx, dy, dz) || 1e-6, diff = (d - len) / d * 0.5 * sf;
        const wa = pinned[a] ? 0 : 1, wb = pinned[b] ? 0 : 1, ws = wa + wb || 1;
        const fa = diff * wa / ws * 2, fb = diff * wb / ws * 2;
        px[ka] += dx * fa; px[ka + 1] += dy * fa; px[ka + 2] += dz * fa;
        px[kb] -= dx * fb; px[kb + 1] -= dy * fb; px[kb + 2] -= dz * fb;
      }
    }
  }
  // relax: blend each free point a touch toward its neighbours so folds stay long and silky
  for (let j = 1; j < ROWS - 1; j++) for (let i = 0; i < COLS; i++) {
    const k = idx(i, j) * 3, u = idx(i, j - 1) * 3, d = idx(i, j + 1) * 3;
    for (let q = 0; q < 3; q++) px[k + q] += ((px[u + q] + px[d + q]) * 0.5 - px[k + q]) * 0.06;
  }
}
function upload() {
  for (let p = 0; p < N; p++) { const k = p * 3; pos[k] = px[k]; pos[k + 1] = WORLD_H - px[k + 1]; pos[k + 2] = px[k + 2]; }
  geo.attributes.position.needsUpdate = true; geo.computeVertexNormals(); geo.computeBoundingSphere();
}

/* ---------- loop ---------- */
let last = performance.now(), acc = 0, running = true;
document.addEventListener("visibilitychange", () => { running = !document.hidden; last = performance.now(); });
function frame(now) {
  requestAnimationFrame(frame);
  if (!running) return;
  acc += Math.min(0.05, (now - last) / 1000); last = now;
  while (acc >= STEP) { time += STEP; simulate(time); acc -= STEP; }
  upload(); renderer.render(scene, camera);
}
for (let i = 0; i < 240; i++) { time += STEP; simulate(time); }   // let it settle before the first frame
requestAnimationFrame(frame);
window.__cloth = { px, N, COLS, ROWS };
</script>
</body>
</html>
