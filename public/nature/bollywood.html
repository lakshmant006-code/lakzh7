<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bollywood</title>
<style>
  :root { --paper: #f5f3ef; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  /* one fixed 1400 x 1000 world, scaled to fit, every layer placed in percentages of it */
  .world { position: absolute; left: 50%; top: 50%; width: min(100vw, 140vh); aspect-ratio: 1400 / 1000; transform: translate(-50%, -50%); }
  .world > * { position: absolute; display: block; pointer-events: none; }
  .glow { inset: -10% -6%; background: radial-gradient(48% 52% at 50% 46%, rgba(255, 214, 170, .55), rgba(255, 226, 196, .22) 55%, transparent 78%); }
  .taj   { left: 10.714%; top: 22%;   width: 78.571%; }
  .frame { left: 14.286%; top: 4.2%;  width: 71.429%; }
  .lady  { left: 41.4%;   top: 62.2%; width: 17.3%; }   /* placed from SCALE in the script */
  .taj, .frame { filter: brightness(1.07) contrast(.97) saturate(.96); }   /* a touch lighter */
  .taj { opacity: .8; }                                                      /* a little cloudy, the haze of the paper shows through */
  .man { transition: opacity .5s ease; }
  .man   { left: 24.64%;  top: 60.5%; width: 7.93%; }   /* the photographer, on the left of the platform */
  .world > canvas { inset: 0; width: 100%; height: 100%; pointer-events: auto; cursor: pointer; touch-action: none; }
</style>
</head>
<body>
<div class="world" id="world">
  <div class="glow"></div>
  <img class="taj"   src="./bollywood/taj.webp"   alt="The Taj Mahal" draggable="false">
  <img class="frame" src="./bollywood/frame.webp" alt="" draggable="false">
  <img class="man"   src="./bollywood/photographer.webp" alt="A photographer in a cream shirt and backpack, raising a camera toward the Taj Mahal" draggable="false">
  <img class="lady"  src="./bollywood/lady.webp"  alt="A woman in a cream and green lehenga, arms open, seen from behind" draggable="false">
  <canvas id="c" aria-label="Her dupatta flows in the wind. Move the pointer to stir the air, tap for a gust."></canvas>
</div>

<script type="module">
import * as THREE from "./vendor/three.module.min.js";
THREE.ColorManagement.enabled = false;

const WORLD_W = 1400, WORLD_H = 1000;
/* how big she is, as a fraction of the original (1 = filling the arch). Everything about her
   (her place on the platform, the dupatta, and its physics) is derived from this one number. */
const SCALE = 0.34;
const LADY_W = 714 * SCALE, LADY_H = 700 * SCALE;
const LADY_LEFT = 770 - LADY_W / 2, LADY_TOP = 614;      // head top sits on y=616 (the line the user marked)
{ const el = document.querySelector(".lady"); el.style.left = (LADY_LEFT / WORLD_W * 100) + "%"; el.style.top = (LADY_TOP / WORLD_H * 100) + "%"; el.style.width = (LADY_W / WORLD_W * 100) + "%"; }
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- renderer: an orthographic view that matches the 1400 x 1000 world ---------- */
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, stencil: true, powerPreference: "high-performance" });
let pixelRatio = Math.min(devicePixelRatio || 1, 1.5);                       // 1.5 is plenty for silk; it drops to 1 if the machine struggles
renderer.setPixelRatio(pixelRatio);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(0, WORLD_W, WORLD_H, 0, -3000, 3000);
camera.position.z = 1000;
const fit = () => { const r = canvas.getBoundingClientRect(); renderer.setPixelRatio(pixelRatio); renderer.setSize(r.width, r.height, false); };
new ResizeObserver(fit).observe(canvas); fit();


/* ---------- the dupatta: a gathered silk rectangle, simulated in ./bollywood/cloth.worker.js ---------- */
const COLS = 26, ROWS = 120, N = COLS * ROWS;      // must match the worker
const LENGTH = 600, W_TOP = 28, W_FULL = 150;
const ANCHOR = { x: LADY_LEFT + 85 * 0.7 * SCALE, y: LADY_TOP + 275.7 * 0.7 * SCALE }; // her left hand, in world pixels (y down)
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const manEl = document.querySelector(".man");

/* The simulation runs on a light grid; the GPU draws it through a smooth Catmull-Rom surface three times finer each way,
   so folds are round and creases are crisp without the physics getting heavier. Positions go up as a float texture. */
const SUBD = 3, RC = (COLS - 1) * SUBD + 1, RR = (ROWS - 1) * SUBD + 1;
const posData = new Float32Array(N * 4);
const posTex = new THREE.DataTexture(posData, COLS, ROWS, THREE.RGBAFormat, THREE.FloatType);
posTex.minFilter = posTex.magFilter = THREE.NearestFilter; posTex.generateMipmaps = false;
const geo = new THREE.BufferGeometry();
const grid = new Float32Array(RC * RR * 2), ind = [];
for (let j = 0; j < RR; j++) for (let i = 0; i < RC; i++) { const k = (j * RC + i) * 2; grid[k] = i / SUBD; grid[k + 1] = j / SUBD; }
for (let j = 0; j < RR - 1; j++) for (let i = 0; i < RC - 1; i++) {
  const a = j * RC + i, b = a + 1, c = a + RC, d = c + 1;
  ind.push(a, c, b, b, c, d);
}
geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(RC * RR * 3), 3));
geo.setAttribute("aGrid", new THREE.BufferAttribute(grid, 2));
geo.setIndex(ind);
const clothVS = `uniform sampler2D posTex; uniform vec2 gridN; uniform vec3 restDim; uniform vec2 offset;
  attribute vec2 aGrid; varying vec2 vUv; varying vec3 vN; varying vec3 vP; varying vec2 vF;
  vec3 tx(int i, int j){ return texelFetch(posTex, ivec2(clamp(i, 0, int(gridN.x) - 1), clamp(j, 0, int(gridN.y) - 1)), 0).xyz; }
  vec4 cr(float t){ float t2 = t * t, t3 = t2 * t; return vec4(-0.5 * t3 + t2 - 0.5 * t, 1.5 * t3 - 2.5 * t2 + 1.0, -1.5 * t3 + 2.0 * t2 + 0.5 * t, 0.5 * t3 - 0.5 * t2); }
  vec3 P(vec2 g){
    g = clamp(g, vec2(0.0), gridN - 1.0);
    vec2 f = min(floor(g), gridN - 2.0), t = g - f; ivec2 b = ivec2(f); vec4 wx = cr(t.x), wy = cr(t.y); vec3 r = vec3(0.0);
    for (int y = 0; y < 4; y++) {
      int jj = b.y + y - 1;
      r += (tx(b.x - 1, jj) * wx.x + tx(b.x, jj) * wx.y + tx(b.x + 1, jj) * wx.z + tx(b.x + 2, jj) * wx.w) * wy[y];
    }
    return r;
  }
  void main(){
    const float e = 0.5;
    vec3 p = P(aGrid), xa = P(aGrid + vec2(e, 0.0)), xb = P(aGrid - vec2(e, 0.0)), ya = P(aGrid + vec2(0.0, e)), yb = P(aGrid - vec2(0.0, e));
    vec3 du = xa - xb, dv = ya - yb;
    vN = normalize(cross(du, dv) + 1e-6);
    float v = aGrid.y / (gridN.y - 1.0);
    float across = (restDim.y + (restDim.z - restDim.y) * smoothstep(0.0, 0.2, v)) / (gridN.x - 1.0), along = restDim.x;
    float curve = length(xa + xb - 2.0 * p) / (across * e * e) + length(ya + yb - 2.0 * p) / (along * e * e);   // how sharply it bends here
    float strain = (length(du) / (2.0 * e * across) - 1.0) + (length(dv) / (2.0 * e * along) - 1.0);           // squeezed (<0) or pulled (>0)
    vF = vec2(clamp(curve * 0.6, 0.0, 1.0), clamp(strain * 3.0, -1.0, 1.0));
    vUv = vec2(aGrid.x / (gridN.x - 1.0), 1.0 - v); vP = p;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(p + vec3(offset, 0.0), 1.0);
  }`;
const gridUniforms = () => ({ posTex: { value: posTex }, gridN: { value: new THREE.Vector2(COLS, ROWS) },
  restDim: { value: new THREE.Vector3(LENGTH / (ROWS - 1), W_TOP, W_FULL) }, offset: { value: new THREE.Vector2() } });
const tex = new THREE.TextureLoader().load("./bollywood/dupatta.webp");
tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
// silk: the pattern in its own colours, softly lit from the upper left, with a faint sheen where it turns edge-on
const mat = new THREE.ShaderMaterial({
  uniforms: { map: { value: tex }, alpha: { value: 1 }, time: { value: 0 }, wrap: { value: 0 }, ...gridUniforms() },
  transparent: true,
  side: THREE.DoubleSide,
  extensions: { derivatives: true },
  vertexShader: clothVS,
  fragmentShader: `uniform sampler2D map; uniform float alpha; uniform float wrap; varying vec2 vUv; varying vec3 vN; varying vec3 vP; varying vec2 vF;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f); return mix(mix(h(i), h(i + vec2(1, 0)), f.x), mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), f.x), f.y); }
    void main(){
      vec3 dp1 = dFdx(vP), dp2 = dFdy(vP); vec2 du1 = dFdx(vUv), du2 = dFdy(vUv);
      vec3 T = normalize(dp1 * du2.y - dp2 * du1.y + 1e-6);                  // along the warp threads
      vec3 n = normalize(vN); if (dot(n, cross(dp1, dp2)) < 0.0) n = -n;            // always the side facing us
      // fine crumples where the cloth is squeezed: small wobbling normals scaled by compression
      float sq = clamp(-vF.y, 0.0, 1.0) + 0.25 * vF.x;
      vec2 q = vUv * vec2(60.0, 170.0);
      n = normalize(n + (vec3(vn(q) - 0.5, vn(q + 7.3) - 0.5, vn(q * 1.7 + 3.1) - 0.5)) * (0.06 + 0.55 * sq));
      vec3 L = normalize(vec3(-0.45, 0.55, 0.7)), V = vec3(0.0, 0.0, 1.0), H = normalize(L + V);
      float diff = max(dot(n, L), 0.0);
      float back = pow(clamp(dot(-n, L), 0.0, 1.0), 1.4);                    // light shining through the silk
      float ts = dot(T, H), aniso = pow(sqrt(max(0.0, 1.0 - ts * ts)), 36.0) * smoothstep(0.0, 0.4, diff + 0.1);
      float rim = pow(1.0 - abs(n.z), 2.6);
      vec3 base = texture2D(map, vUv).rgb;
      float wp = 0.5 + 0.5 * sin(vUv.x * 520.0) * sin(vUv.y * 1500.0);        // the weave, faint, fading as it gets too fine
      float wv = mix(1.0, 0.94 + 0.10 * wp, 0.85);
      float ao = 1.0 - 0.22 * vF.x;                                           // the deep of a fold is darker
      vec3 col = base * wv * ao * (0.78 + 0.34 * diff - 0.08 * (1.0 - abs(n.z)));
      col *= 1.0 - 0.30 * wrap * pow(1.0 - abs(n.z), 1.6);                    // on him: it turns away into shade at his sides, so his roundness reads
      col += base * vec3(1.0, 0.9, 0.72) * back * 0.30;                       // warm glow through thin layers
      col += vec3(1.0, 0.95, 0.84) * (aniso * 0.20 + rim * 0.10);             // silk sheen
      gl_FragColor = vec4(col, alpha);
    }`,
});
// each shadow darkens a pixel once, however many layers of silk are folded over it (the stencil remembers)
const shadows = [[10, -14, 0.10], [20, -26, 0.08], [32, -40, 0.06]].map(([dx, dy, o], n) => {
  const u = gridUniforms(); u.offset.value.set(dx, dy); u.opacity = { value: o };
  const m = new THREE.Mesh(geo, new THREE.ShaderMaterial({ uniforms: u, transparent: true, depthWrite: false, side: THREE.DoubleSide, vertexShader: clothVS,
    stencilWrite: true, stencilRef: n + 1, stencilFunc: THREE.NotEqualStencilFunc, stencilZPass: THREE.ReplaceStencilOp,
    fragmentShader: "uniform float opacity; void main(){ gl_FragColor = vec4(0.29, 0.227, 0.188, opacity); }" }));
  m.position.z = -2; m.frustumCulled = false; m.renderOrder = -1; scene.add(m); return m;
});
const cloth = new THREE.Mesh(geo, mat); cloth.frustumCulled = false; scene.add(cloth);

/* ---------- the worker: physics off the main thread, so drawing stays smooth whatever the simulation costs ---------- */
const sim = new Worker(new URL("./bollywood/cloth.worker.js", location.href));
let stepMs = 0, A = null, B = null, alphaT = 0, mode = "held", wrap = 0, centre = { x: 0, y: 0 }, busy = true, pendingDt = 0, ready = false;
sim.onmessage = (e) => {
  const m = e.data;
  if (m.type === "ready") { ready = true; return; }
  A = m.a; B = m.b; alphaT = m.alpha; stepMs = m.stepMs; mode = m.mode; wrap = m.wrap; centre = m.centre; busy = false;
};
sim.postMessage({ type: "init", SCALE, ANCHOR, reduce });
addEventListener("message", (e) => { if (e.data && typeof e.data.wind === "number") sim.postMessage({ type: "wind", v: e.data.wind }); });
function worldPoint(ev) { const r = canvas.getBoundingClientRect(); return { x: (ev.clientX - r.left) / r.width * WORLD_W, y: (ev.clientY - r.top) / r.height * WORLD_H }; }
canvas.addEventListener("pointermove", (ev) => sim.postMessage({ type: "pointer", p: worldPoint(ev) }));
canvas.addEventListener("pointerleave", () => sim.postMessage({ type: "pointer", p: null }));
canvas.addEventListener("pointerdown", () => sim.postMessage({ type: "down" }));

// drawn between the last two physics steps, so it glides at any refresh rate (60, 90 or 120 Hz)
function upload() {
  if (!A) return;
  const a = alphaT, b = 1 - a;
  for (let q = 0; q < N; q++) { const k = q * 3, o = q * 4; posData[o] = B[k] * a + A[k] * b; posData[o + 1] = WORLD_H - (B[k + 1] * a + A[k + 1] * b); posData[o + 2] = B[k + 2] * a + A[k + 2] * b; }
  posTex.needsUpdate = true;
}

/* ---------- loop ---------- */
let last = performance.now(), running = true, time = 0, ft = 0.016, slow = 0, quality = 0;
document.addEventListener("visibilitychange", () => { running = !document.hidden; last = performance.now(); });
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!running) return;
  // if frames keep taking longer than ~24 ms, make each one cheaper: drop to 1x pixels, then skip the soft shadows
  ft += (dt - ft) * 0.05; slow = ft > 0.024 ? slow + dt : Math.max(0, slow - dt);
  if (slow > 1.2 && quality < 2) { quality++; slow = 0; ft = 0.016; if (quality === 1) { pixelRatio = 1; fit(); } }
  time += dt; pendingDt += dt;
  if (!busy) { busy = true; sim.postMessage({ type: "tick", dt: pendingDt }); pendingDt = 0; }   // never queue: if it is behind, it gets one larger step
  manEl.style.opacity = 1 - 0.6 * smooth(0.6, 1, wrap);        // he shows faintly through the silk
  mat.uniforms.alpha.value = 1 - 0.2 * smooth(0.5, 1, wrap); mat.uniforms.wrap.value = smooth(0.3, 1, wrap); mat.uniforms.time.value = time;
  for (const m of shadows) m.visible = wrap < 0.7 && quality < 2;
  cloth.visible = !!A; for (const m of shadows) m.visible = m.visible && !!A && quality < 2;
  upload(); renderer.render(scene, camera);
}
requestAnimationFrame(frame);
window.__cloth = { N, COLS, ROWS, get ready() { return !!A; }, get stepMs() { return stepMs; }, get mode() { return mode; }, get centre() { return centre; }, click: () => canvas.dispatchEvent(new PointerEvent("pointerdown")), get wrap() { return wrap; } };
</script>
</body>
</html>
