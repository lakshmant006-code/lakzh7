<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Street</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f5f3ef; }
  /* the street is built in its own 524 × 844 space, then turned and scaled to cover the frame */
  .street { position: absolute; left: 50%; top: 50%; width: 524px; height: 844px; transform-origin: 50% 50%; }
  .street > * { position: absolute; top: 0; height: 844px; }
  .ground { left: 0; width: 524px; background:
      linear-gradient(90deg, #c9b18e 0 118px, #b9977a 118px 165px, #8b8681 165px 362px, #b9977a 362px 409px, #c9b18e 409px); }
  .ground::after { content: ""; position: absolute; inset: 0; opacity: .35; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .35  0 0 0 0 .3  0 0 0 .8 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .lane { left: 260px; width: 6px; background: repeating-linear-gradient(to bottom, #e7c33a 0 18px, #3a3530 18px 30px); opacity: .9; }
  .edge { width: 2px; background: rgba(255,255,255,.35); }
  .street img { display: block; }
</style>
</head>
<body>
<div class="street" id="street">
  <div class="ground"></div>
  <div class="lane"></div>
  <div class="edge" style="left:170px"></div>
  <div class="edge" style="left:356px"></div>
  <img src="./street/buildings-left.png" alt="" style="left:0">
  <img src="./street/buildings-right.png" alt="" style="left:409px">
  <img src="./street/people.png" alt="" style="left:135px">
  <img src="./street/trees-left.png" alt="" style="left:70px">
  <img src="./street/trees-right.png" alt="" style="left:330px">
</div>
<script>
  // lie the street along the longer side of the frame and cover it
  const el = document.getElementById("street");
  function fit() {
    const w = innerWidth, h = innerHeight, wide = w > h;
    const sw = wide ? 844 : 524, sh = wide ? 524 : 844;
    const s = Math.max(w / sw, h / sh);
    el.style.transform = `translate(-50%, -50%) rotate(${wide ? -90 : 0}deg) scale(${s})`;
  }
  addEventListener("resize", fit); fit();
</script>
</body>
</html>
