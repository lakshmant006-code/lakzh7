<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Street</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f5f3ef; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  body.over canvas { cursor: pointer; }
  .be-cow { all: unset; position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 3; cursor: pointer;
    padding: 9px 16px; border-radius: 999px; background: rgba(245,243,239,.9); color: #2c2420; font: 500 13px/1 "DM Sans", -apple-system, system-ui, sans-serif;
    box-shadow: 0 4px 18px rgba(44,36,32,.18); }
  .be-cow[aria-pressed="true"] { background: #2c2420; color: #f5f3ef; }
  body.cow-mode canvas { cursor: none; }
  /* film grain over the finished picture, gently shifting like real grain */
  .grain { position: fixed; inset: -40px; pointer-events: none; opacity: .7; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .48  0 0 0 0 .44  0 0 0 1.6 -.3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain .9s steps(6) infinite; }
  .grain.fine { opacity: .42; mix-blend-mode: multiply; background-size: 140px 140px; animation-duration: 1.3s; }
  @keyframes grain { 0% { transform: translate(0, 0); } 20% { transform: translate(-17px, 9px); } 40% { transform: translate(11px, -21px); }
    60% { transform: translate(-7px, 15px); } 80% { transform: translate(19px, 4px); } 100% { transform: translate(0, 0); } }
  @media (prefers-reduced-motion: reduce) { .grain { animation: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button class="be-cow" type="button" aria-pressed="false">be the cow</button>
<div class="grain"></div>
<div class="grain fine"></div>
<script type="module">
import * as THREE from "./vendor/three.module.min.js";

/* The street lives in its own 524 × 844 space (x right, y down), the size of the source layers. */
const SW = 524, SH = 844;
const ROAD = [170, 356], WALK_L = [118, 165], WALK_R = [362, 409];
const LAYER_X = 135;                       // where the traffic layer sat on the street

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setClearColor(0xf5f3ef);
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 20);
camera.position.z = 10;
const world = new THREE.Group(); scene.add(world);

const toWorld = (x, y) => [x - SW / 2, SH / 2 - y];
const loader = new THREE.TextureLoader();
const tex = (url) => { const t = loader.load(url); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; };
function plane(map, w, h, x, y, z) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map, transparent: true, depthWrite: false }));
  const [wx, wy] = toWorld(x + w / 2, y + h / 2); m.position.set(wx, wy, z); world.add(m); return m;
}

/* ---------- ground: sand, sidewalks, asphalt and lane paint, drawn once ---------- */
{
  const k = 2, c = document.createElement("canvas"); c.width = SW * k; c.height = SH * k;
  const g = c.getContext("2d"); g.scale(k, k);
  const band = (x0, x1, col) => { g.fillStyle = col; g.fillRect(x0, 0, x1 - x0, SH); };
  band(0, SW, "#c9b18e"); band(WALK_L[0], WALK_L[1], "#b9977a"); band(WALK_R[0], WALK_R[1], "#b9977a"); band(WALK_L[1], WALK_R[0], "#8b8681");
  for (let i = 0; i < 9000; i++) {          // grit
    const x = Math.random() * SW, y = Math.random() * SH, r = Math.random() * 1.2 + 0.2;
    g.fillStyle = `rgba(${Math.random() < 0.5 ? "40,34,28" : "255,250,240"},${Math.random() * 0.12})`; g.fillRect(x, y, r, r);
  }
  g.fillStyle = "rgba(255,255,255,.35)"; g.fillRect(ROAD[0], 0, 2, SH); g.fillRect(ROAD[1] - 2, 0, 2, SH);
  for (let y = 0; y < SH; y += 30) { g.fillStyle = "#e7c33a"; g.fillRect(260, y, 6, 18); g.fillStyle = "#3a3530"; g.fillRect(260, y + 18, 6, 12); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  plane(t, SW, SH, 0, 0, 0);
}
plane(tex("./street/buildings-left.png"), 118, 844, 0, 0, 1);
plane(tex("./street/buildings-right.png"), 115, 844, 409, 0, 1);
// trees cast soft shadows down and to the left, the same way the traffic's shadows fall; they land on the road and on anything driving under them
const treeTex = [tex("./street/trees-left.png"), tex("./street/trees-right.png")];
const SHADOW_FS = `uniform sampler2D map; uniform vec2 texel; uniform float strength; varying vec2 vUv;
  void main(){
    float a = 0.0, wsum = 0.0;
    for (int i = -3; i <= 3; i++) for (int j = -3; j <= 3; j++) {
      float w = exp(-float(i * i + j * j) / 6.0);
      a += texture2D(map, vUv + vec2(float(i), float(j)) * texel * 2.2).a * w; wsum += w;
    }
    gl_FragColor = vec4(0.11, 0.13, 0.22, (a / wsum) * strength);
  }`;
function treeShadow(map, w, h, x, y) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.ShaderMaterial({
    uniforms: { map: { value: map }, texel: { value: new THREE.Vector2(1 / w, 1 / h) }, strength: { value: 0.68 } },
    vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
    fragmentShader: SHADOW_FS, transparent: true, depthWrite: false,
  }));
  const [wx, wy] = toWorld(x + w / 2 - 24, y + h / 2 + 18);   // offset down-left
  m.position.set(wx, wy, 4.6); m.scale.set(1.04, 1.02, 1); world.add(m); return m;
}
treeShadow(treeTex[0], 145, 844, 70, 0); treeShadow(treeTex[1], 131, 844, 330, 0);
const trees = [plane(treeTex[0], 145, 844, 70, 0, 5), plane(treeTex[1], 131, 844, 330, 0, 5)];

/* ---------- vehicles: each one cut from the traffic layer and driven the way it faces ---------- */
const SCALE = { car: 0.78, auto: 0.78, truck: 0.78, scooter: 0.8, ped: 0.85 };
const SPEED = { car: [52, 70], auto: [38, 52], truck: [28, 38], scooter: [42, 72], ped: [9, 15] };
const vehicles = [];
const atlas = await fetch("./street/vehicles.json").then((r) => r.json());
const sheet = await new Promise((res) => loader.load("./street/vehicles.png", res));
sheet.colorSpace = THREE.SRGBColorSpace;
function spriteMesh(base, W, H, ax, ay, aw, ah) {
  const t = base.clone();
  t.repeat.set(aw / W, ah / H); t.offset.set(ax / W, 1 - (ay + ah) / H); t.needsUpdate = true;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(aw, ah), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false }));
  world.add(mesh); return mesh;
}
for (const it of atlas.items) {
  if (it.type === "cow") continue;                       // the cows are drawn fresh below
  const k = SCALE[it.type];
  const mesh = spriteMesh(sheet, atlas.w, atlas.h, it.ax, it.ay, it.aw, it.ah);
  const [a, b] = SPEED[it.type];
  vehicles.push({
    mesh, type: it.type, dir: it.dir, k, x: LAYER_X + it.cx, y: it.cy, w: it.aw * k, h: it.ah * k,
    z: it.type === "ped" ? 2 : it.type === "scooter" ? 3 : 2.5,
    base: a + Math.random() * (b - a), speed: 0, phase: Math.random() * 6.28, boost: 0, pop: 0, lastHonk: -9,
    tx: null, stuck: 0, wob: 0, wobV: 0, bumpCool: 0,
  });
}
// spread the traffic so nothing starts on top of something else
for (const v of vehicles) if (v.type !== "ped") v.x = Math.min(ROAD[1] - v.w / 2, Math.max(ROAD[0] + v.w / 2, v.x));

/* ---------- cows: a few wander across the road; one can be you ---------- */
const cowAtlas = await fetch("./street/cows.json").then((r) => r.json());
const cowSheet = await new Promise((res) => loader.load("./street/cows.png", res));
cowSheet.colorSpace = THREE.SRGBColorSpace;
const COW_LEN = 58;                                      // body length on the street, head to tail
const cows = [];
function makeCow(i, player = false) {
  const f = cowAtlas.items[i % cowAtlas.items.length];
  const mesh = spriteMesh(cowSheet, cowAtlas.w, cowAtlas.h, f.ax, f.ay, f.aw, f.ah);
  const k = COW_LEN / f.ah;
  mesh.scale.setScalar(k);
  const c = { mesh, k, w: f.aw * k * 0.7, h: f.ah * k * 0.8, x: 140 + Math.random() * 240, y: 120 + Math.random() * 600,
    tx: 0, ty: 0, heading: Math.random() * 6.28, speed: 0, pause: 0, phase: Math.random() * 6, player, lastMoo: -9 };
  pickTarget(c); cows.push(c); return c;
}
function pickTarget(c) {
  // cross the road at an angle, or amble along it
  c.tx = 120 + Math.random() * 290; c.ty = Math.max(30, Math.min(SH - 30, c.y + (Math.random() - 0.5) * 360));
}
for (let i = 0; i < 3; i++) makeCow(i);
let me = null;                                           // the cow you walk, when "be the cow" is on

/* ---------- sound (ElevenLabs sound effects) ---------- */
const SFX = { auto: "auto", car: "car", scooter: "scooter", truck: "truck", cow: "cow", ped: "whistle", chaos: "chaos" };
const GAIN = { auto: 0.75, car: 0.6, scooter: 0.5, truck: 0.7, cow: 0.8, whistle: 0.45, chaos: 0.55 };
let ctx = null; const buffers = {};
function unlock() {
  if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  for (const name of new Set(Object.values(SFX))) {
    fetch(`./street/sfx/${name}.mp3`).then((r) => r.arrayBuffer()).then((b) => ctx.decodeAudioData(b)).then((buf) => (buffers[name] = buf)).catch(() => {});
  }
}
let lastAny = 0;
function play(name, gain = 1, delay = 0) {
  if (!ctx || !buffers[name]) return;
  const src = ctx.createBufferSource(), g = ctx.createGain();
  src.buffer = buffers[name]; src.playbackRate.value = 0.92 + Math.random() * 0.16;
  g.gain.value = (GAIN[name] ?? 0.6) * gain;
  src.connect(g).connect(ctx.destination); src.start(ctx.currentTime + delay);
}
["pointerdown", "keydown", "touchstart"].forEach((e) => addEventListener(e, unlock, { passive: true }));

/* ---------- framing: the street lies along the longer side of the frame and covers it ---------- */
let wide = false;
function fit() {
  const w = innerWidth, h = innerHeight; wide = w > h;
  renderer.setSize(w, h, false);
  world.rotation.z = wide ? Math.PI / 2 : 0;
  const sw = wide ? SH : SW, sh = wide ? SW : SH, s = Math.max(w / sw, h / sh);
  camera.left = -w / (2 * s); camera.right = w / (2 * s); camera.top = h / (2 * s); camera.bottom = -h / (2 * s);
  camera.updateProjectionMatrix();
}
addEventListener("resize", fit); fit();

/* ---------- pointer: hover honks, click sets off the whole street ---------- */
const v3 = new THREE.Vector3();
function streetAt(cx, cy) {
  v3.set((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1, 0).unproject(camera);
  world.worldToLocal(v3);
  return [v3.x + SW / 2, SH / 2 - v3.y];
}
function hit(cx, cy) {
  const [x, y] = streetAt(cx, cy);
  let best = null;
  for (const v of vehicles) {
    const hw = Math.max(5, v.w / 2 - 5), hh = Math.max(5, v.h / 2 - 5);
    if (Math.abs(x - v.x) < hw && Math.abs(y - v.y) < hh && (!best || v.z > best.z)) best = v;
  }
  for (const c of cows) if (!c.player && Math.hypot(x - c.x, y - c.y) < 16) best = { cow: c };
  return best;
}
function honk(v, gain = 1, delay = 0) {
  const now = performance.now() / 1000;
  if (now - v.lastHonk < 1.1) return;
  v.lastHonk = now; v.pop = 1; v.boost = Math.max(v.boost, 0.5);
  play(SFX[v.type], gain, delay);
}
function moo(c, gain = 1) { const now = performance.now() / 1000; if (now - c.lastMoo < 1.6) return; c.lastMoo = now; play("cow", gain); }
let hovered = null, pointer = null;
addEventListener("pointermove", (e) => {
  pointer = streetAt(e.clientX, e.clientY);
  if (me) { document.body.classList.remove("over"); return; }
  const v = hit(e.clientX, e.clientY);
  document.body.classList.toggle("over", !!v);
  if (v && v !== hovered && !(hovered && v.cow && hovered.cow === v.cow)) {
    const now = performance.now();
    if (now - lastAny > 120) { v.cow ? moo(v.cow) : honk(v); lastAny = now; }
  }
  hovered = v;
});
addEventListener("pointerdown", (e) => {
  unlock();
  if (e.target.closest(".be-cow")) return;
  pointer = streetAt(e.clientX, e.clientY);
  if (me) return;
  const v = hit(e.clientX, e.clientY); if (!v) return;
  if (v.cow) { v.cow.lastMoo = -9; moo(v.cow, 1.2); return; }
  v.lastHonk = -9; honk(v, 1.2); v.boost = 1.6;
  play("chaos", 1, 0.05);
  const near = vehicles.filter((o) => o !== v && o.type !== "ped" && Math.hypot(o.x - v.x, o.y - v.y) < 170)
    .sort(() => Math.random() - 0.5).slice(0, 4);
  near.forEach((o, i) => { o.lastHonk = -9; honk(o, 0.7, 0.25 + i * 0.22); });
});
addEventListener("pointerleave", () => (pointer = null));

/* ---------- "be the cow": you walk, the traffic waits ---------- */
const beCow = document.querySelector(".be-cow");
beCow.addEventListener("click", () => {
  unlock();
  if (me) { me.mesh.removeFromParent(); cows.splice(cows.indexOf(me), 1); me = null; }
  else { me = makeCow(cows.length, true); if (pointer) { me.x = pointer[0]; me.y = pointer[1]; } moo(me); }
  beCow.setAttribute("aria-pressed", String(!!me)); beCow.textContent = me ? "stop being the cow" : "be the cow";
  document.body.classList.toggle("cow-mode", !!me);
});

/* ---------- traffic ---------- */
const LANES = []; for (let x = ROAD[0] + 14; x <= ROAD[1] - 14; x += 16) LANES.push(x);
const clampX = (v) => { if (v.type !== "ped") v.x = Math.min(ROAD[1] - v.w / 2 + 4, Math.max(ROAD[0] + v.w / 2 - 4, v.x)); };
function freeAhead(v, x) {                                  // how far a vehicle could drive in lane x before meeting something
  let best = 260;
  for (const o of vehicles) {
    if (o === v || o.type === "ped" || Math.abs(o.x - x) > (v.w + o.w) * 0.5) continue;
    const ahead = (o.y - v.y) * v.dir; if (ahead > 0) best = Math.min(best, ahead - (v.h + o.h) * 0.5);
  }
  for (const c of cows) { if (Math.abs(c.x - x) > (v.w + c.w) * 0.5 + 6) continue; const ahead = (c.y - v.y) * v.dir; if (ahead > 0) best = Math.min(best, ahead - v.h * 0.5 - 20); }
  return best;
}
function reroute(v) {
  let bestX = v.x, bestFree = freeAhead(v, v.x) + 8;          // only move if another lane is clearly better
  for (const x of LANES) { if (Math.abs(x - v.x) > 70) continue; const f = freeAhead(v, x) - Math.abs(x - v.x) * 0.15; if (f > bestFree) { bestFree = f; bestX = x; } }
  if (bestX !== v.x) v.tx = bestX;
}
let last = performance.now(), t = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;

  // cows amble toward a target, pause, chew, move on; yours follows the pointer
  for (const c of cows) {
    let tx = c.tx, ty = c.ty, max = 9;
    if (c.player) { if (pointer) { tx = pointer[0]; ty = pointer[1]; } max = 70; }
    const dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy);
    if (!c.player && c.pause > 0) { c.pause -= dt; c.speed *= 0.9; }
    else if (!c.player && d < 6) { c.pause = 1.5 + Math.random() * 3; pickTarget(c); }
    else {
      const want = c.player ? Math.min(max, d * 2.2) : max * (0.7 + 0.3 * Math.sin(t * 0.5 + c.phase));
      c.speed += (want - c.speed) * Math.min(1, dt * 3);
      if (d > 0.5) {
        const h = Math.atan2(dx, -dy);
        c.heading += Math.atan2(Math.sin(h - c.heading), Math.cos(h - c.heading)) * Math.min(1, dt * (c.player ? 6 : 1.6));
      }
      const step = Math.min(d, c.speed * dt);
      c.x += Math.sin(c.heading) * step; c.y -= Math.cos(c.heading) * step;
    }
    c.x = Math.max(20, Math.min(SW - 20, c.x)); c.y = Math.max(10, Math.min(SH - 10, c.y));
    const [wx, wy] = toWorld(c.x, c.y);
    const bob = 1 + 0.025 * Math.sin(t * 9 + c.phase) * Math.min(1, c.speed / 6);
    c.mesh.position.set(wx, wy, 4); c.mesh.rotation.z = -c.heading; c.mesh.scale.set(c.k * bob, c.k / bob, 1);
  }

  for (const v of vehicles) {
    let want = v.base * (1 + 0.18 * Math.sin(t * 0.6 + v.phase)) * (1 + v.boost);
    let blocked = false;
    if (v.type !== "ped") {
      for (const o of vehicles) {
        if (o === v || o.dir !== v.dir || o.type === "ped") continue;
        if (Math.abs(o.x - v.x) > (v.w + o.w) * 0.42) continue;
        const ahead = (o.y - v.y) * v.dir; if (ahead <= 0) continue;
        const gap = ahead - (v.h + o.h) * 0.5;
        if (gap < 14) { want = Math.min(want, Math.max(0, o.speed * (gap / 14))); blocked = true; }
      }
      // everyone stops for a cow
      for (const c of cows) {
        if (Math.abs(c.x - v.x) > (v.w + c.w) * 0.5 + 4) continue;
        const ahead = (c.y - v.y) * v.dir; if (ahead <= -c.h * 0.3) continue;
        const gap = ahead - v.h * 0.5 - c.h * 0.4;
        if (gap < 30) {
          want = Math.min(want, Math.max(0, v.base * (gap - 6) / 24)); blocked = true;
          if (gap < 18 && Math.random() < dt * 0.25) honk(v, 0.6);
        }
      }
    }
    v.stuck = blocked ? v.stuck + dt : Math.max(0, v.stuck - dt * 2);
    if (v.type !== "ped" && v.stuck > (v.type === "scooter" ? 0.25 : 0.9) && v.tx === null) { reroute(v); v.stuck = 0; }
    // steer toward the chosen lane
    if (v.tx !== null) {
      const dx = v.tx - v.x, s = (v.type === "scooter" ? 48 : 30) * dt;
      v.x += Math.max(-s, Math.min(s, dx)); v.wobV += -Math.sign(dx) * dt * 0.4 * (Math.abs(dx) > 1 ? 1 : 0);
      if (Math.abs(dx) < 0.8) v.tx = null;
    } else if (v.type === "scooter") v.x += Math.sin(t * 0.9 + v.phase) * 3 * dt;
    clampX(v);
    v.speed += (want - v.speed) * Math.min(1, dt * 2.4);
    v.boost = Math.max(0, v.boost - dt * 0.7);
    v.y += v.dir * v.speed * dt;
    if (v.dir > 0 && v.y - v.h / 2 > SH + 8) { v.y = -v.h / 2 - Math.random() * 60; v.tx = null; }
    if (v.dir < 0 && v.y + v.h / 2 < -8) { v.y = SH + v.h / 2 + Math.random() * 60; v.tx = null; }
    v.bumpCool = Math.max(0, v.bumpCool - dt);
  }

  // bumps: when two vehicles touch, they jolt apart, wobble, and the one behind finds another way
  for (let i = 0; i < vehicles.length; i++) {
    const a = vehicles[i]; if (a.type === "ped") continue;
    for (let j = i + 1; j < vehicles.length; j++) {
      const b = vehicles[j]; if (b.type === "ped") continue;
      const ox = (a.w + b.w) * 0.5 * 0.82 - Math.abs(a.x - b.x), oy = (a.h + b.h) * 0.5 * 0.82 - Math.abs(a.y - b.y);
      if (ox <= 0 || oy <= 0) continue;
      if (ox < oy) { const s = Math.sign(a.x - b.x) || 1; a.x += s * ox * 0.5; b.x -= s * ox * 0.5; }
      else { const s = Math.sign(a.y - b.y) || 1; a.y += s * oy * 0.5; b.y -= s * oy * 0.5; }
      if (a.bumpCool <= 0 && b.bumpCool <= 0) {
        const rear = a.dir === b.dir ? ((a.y - b.y) * a.dir < 0 ? a : b) : (a.speed > b.speed ? a : b);
        const hard = Math.min(1, (Math.abs(a.speed - b.speed * (a.dir === b.dir ? 1 : -1)) + 10) / 60);
        a.wobV += (Math.random() - 0.5) * 3 * hard; b.wobV += (Math.random() - 0.5) * 3 * hard;
        a.pop = b.pop = 0.6; rear.speed *= 0.3; rear.tx = null; reroute(rear);
        if (rear.tx === null) rear.tx = Math.max(ROAD[0] + 14, Math.min(ROAD[1] - 14, rear.x + (Math.random() < 0.5 ? -24 : 24)));
        a.bumpCool = b.bumpCool = 1.2;
        honk(rear, 0.75);
      }
    }
  }

  for (const v of vehicles) {
    clampX(v);
    v.wobV += -v.wob * 40 * dt; v.wobV *= Math.exp(-dt * 6); v.wob += v.wobV * dt;
    v.pop = Math.max(0, v.pop - dt * 3);
    const s = v.k * (1 + 0.12 * Math.sin(v.pop * Math.PI));
    const [wx, wy] = toWorld(v.x, v.y);
    v.mesh.position.set(wx, wy, v.z); v.mesh.scale.set(s, s, 1); v.mesh.rotation.z = v.wob * 0.35;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__street = { vehicles, cows, streetAt, beCow };
</script>
</body>
</html>
